[package]
name = "alkyhol-shader"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Direct3D DXIL shader translation to native Metal Shading Language"

[dependencies]
dxil-spirv = "=0.1.0"
spirv-cross2 = { version = "=0.7.2", default-features = false, features = ["msl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
alkyhol-d3d12 = { path = "../graphics" }
metal = "=0.32.0"
pollster = "=0.4.0"
