name: Native SIMD comparison evidence
on:
  push:
    paths:
      - jit32/tests/sse_compare_reference.c
      - jit32/tests/rsqrt_reference.c
      - jit32/tests/rcp_reference.c
      - jit32/tests/minmax_reference.c
      - jit32/tests/sqrt_reference.c
      - jit32/tests/movemask_reference.c
      - tools/observe_jit32_movemask_native.py
      - tools/observe_jit32_sqrt_native.py
      - tools/observe_jit32_minmax_native.py
      - tools/observe_jit32_rcp_native.py
      - tools/observe_jit32_rsqrt_native.py
      - tools/observe_jit32_compare_native.py
      - .github/workflows/jit32-compare.yml
  pull_request:
    paths:
      - jit32/tests/sse_compare_reference.c
      - jit32/tests/rsqrt_reference.c
      - jit32/tests/rcp_reference.c
      - jit32/tests/minmax_reference.c
      - jit32/tests/sqrt_reference.c
      - jit32/tests/movemask_reference.c
      - tools/observe_jit32_movemask_native.py
      - tools/observe_jit32_sqrt_native.py
      - tools/observe_jit32_minmax_native.py
      - tools/observe_jit32_rcp_native.py
      - tools/observe_jit32_rsqrt_native.py
      - tools/observe_jit32_compare_native.py
      - .github/workflows/jit32-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe original comparison assembly on native x64 Windows
        run: python tools/observe_jit32_compare_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-simd-comparison
          path: local/jit32/native-compare-reference/
          if-no-files-found: error

  native-rsqrt-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe bounded RSQRT and complete MXCSR on native x64 Windows
        run: python tools/observe_jit32_rsqrt_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rsqrt
          path: local/jit32/native-rsqrt-reference/
          if-no-files-found: error

  native-rcp-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe bounded RCP and complete MXCSR on native x64 Windows
        run: python tools/observe_jit32_rcp_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rcp
          path: local/jit32/native-rcp-reference/
          if-no-files-found: error

  native-minmax-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe exact legacy SIMD minimum/maximum on native x64 Windows
        run: python tools/observe_jit32_minmax_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-minmax
          path: local/jit32/native-minmax-reference/
          if-no-files-found: error

  native-sqrt-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe exact legacy SIMD square-root on native x64 Windows
        run: python tools/observe_jit32_sqrt_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sqrt
          path: local/jit32/native-sqrt-reference/
          if-no-files-found: error

  native-movemask-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe exhaustive legacy sign masks on native x64 Windows
        run: python tools/observe_jit32_movemask_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-movemask
          path: local/jit32/native-movemask-reference/
          if-no-files-found: error
