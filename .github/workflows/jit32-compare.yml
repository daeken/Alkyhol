name: Native SIMD comparison evidence
on:
  push:
    paths:
      - jit32/tests/sse_compare_reference.c
      - tools/observe_jit32_compare_native.py
      - .github/workflows/jit32-compare.yml
  pull_request:
    paths:
      - jit32/tests/sse_compare_reference.c
      - tools/observe_jit32_compare_native.py
      - .github/workflows/jit32-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe original comparison assembly on native x64 Windows
        run: python tools/observe_jit32_compare_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-simd-comparison
          path: local/jit32/native-compare-reference/
          if-no-files-found: error
