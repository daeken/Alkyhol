name: conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo test --offline
      - run: cargo clippy --offline --all-targets -- -D warnings
      - run: cargo build --offline
      - run: python -m unittest discover -s tests -v
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install the C++ source ABI target on macOS
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Execute C++ ABI probes against Rust or the independent Windows SDK
        if: runner.os != 'Linux'
        run: python tools/run_cpp_probes.py --output cpp-observation.json
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: cpp-${{ runner.os }}
          path: cpp-observation.json
      - run: python tools/run_samples.py --output kernel-observation.json
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ runner.os }}
          path: kernel-observation.json
  compare:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          path: observations
      - name: Compare real Windows SDK and native Alkyhol observations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(p.read_text()) for p in Path('observations').glob('*/kernel-observation.json')]
          assert len(reports) == 3, reports
          assert sum(r['backend'] == 'Windows SDK' for r in reports) == 1, reports
          expected = {'kernel_contract', 'msdn_file_write', 'msdn_event_readers', 'msdn_semaphore_workers', 'msdn_thread_local_storage', 'msdn_creating_threads'}
          assert all(r['schema_version'] == 2 and set(r['samples']) == expected for r in reports), reports
          baseline = next(r['samples'] for r in reports if r['backend'] == 'Windows SDK')
          assert all(r['samples'] == baseline for r in reports), reports
          print('Windows SDK, macOS and Linux sample observations agree')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: cpp-*
          path: cpp-observations
      - name: Compare COM probe results and all DirectInput descriptor bytes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in Path('cpp-observations').glob('*/cpp-observation.json')]
          assert len(reports)==2
          assert {r['backend'] for r in reports}=={'native Windows SDK','Rust native-host COM/Win32'}
          assert all(r['schema_version']==1 and r['tracked_tree_clean'] is True for r in reports)
          assert reports[0]['revision']==reports[1]['revision']
          assert set(reports[0]['observations'])=={'com_blob','input_formats'}
          assert reports[0]['observations']==reports[1]['observations']
          assert {r['source']:r['source_sha256'] for r in reports[0]['executions'] if r['source'].endswith(('com_blob.cpp','input_formats.cpp'))}=={r['source']:r['source_sha256'] for r in reports[1]['executions']}
          print('Native Windows SDK and Rust C++ COM probe outputs and all 267 DirectInput descriptors agree')
          PY
  shader:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            local/upstream/DirectXShaderCompiler
            local/dxc-build
          key: dxc-${{ runner.os }}-${{ runner.arch }}-b106a961d09221b3c5bdb37be45b679257da08b8-v1
      - name: Build pinned Microsoft HLSL frontend
        run: python tools/build_dxc.py --jobs 3
      - run: cargo fmt --manifest-path shader/Cargo.toml --check
      - run: cargo clippy --manifest-path shader/Cargo.toml --locked --all-targets -- -D warnings
      - name: Translate DXIL and execute generated Metal (hosted GPU, no RT claim)
        env:
          DXC: ${{ github.workspace }}/local/dxc-build/bin/dxc
        run: |
          cargo test --manifest-path shader/Cargo.toml --locked -- --nocapture 2>&1 | tee shader-validation.txt
          python tools/prepare_sakura_shaders.py --check
          cargo run --manifest-path shader/Cargo.toml --locked --example translate_samples -- "$DXC" --check
          python tools/run_shader_compute.py --dxc "$DXC" --dxil compute.dxil --output shader-compute.json
      - uses: actions/upload-artifact@v4
        with:
          name: shader-compute-Metal
          path: |
            compute.dxil
            shader-compute.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-Metal-validation
          path: shader-validation.txt
  shader-compute-reference:
    needs: shader
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: shader-compute-Metal
          path: shader-compute-input
      - name: Execute the identical DXIL container on native D3D12 WARP
        run: python tools/run_shader_compute.py --dxil shader-compute-input/compute.dxil --output shader-compute.json
      - uses: actions/upload-artifact@v4
        with:
          name: shader-compute-Windows
          path: shader-compute.json
  compare-shader-compute:
    needs: [shader, shader-compute-reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shader-compute-*
          path: compute-observations
      - name: Compare all compute words and untouched tail from the same DXIL
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          from tools.shader_compute_contract import compare_reports
          reports = [json.loads(p.read_text()) for p in Path('compute-observations').glob('*/shader-compute.json')]
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          compare_reports(reports, revision)
          print('Native D3D12 WARP and translated Metal agree on all 96 output words, including the 20-word sentinel tail, from identical DXIL')
          PY
  graphics:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --manifest-path graphics/Cargo.toml --check
      - run: cargo clippy --manifest-path graphics/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test real backend device and submission contracts
        run: cargo test --manifest-path graphics/Cargo.toml --locked -- --nocapture
      - run: cargo fmt --manifest-path sakura/Cargo.toml --check
      - run: cargo clippy --manifest-path sakura/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Sakura CPU units and verified asset intake (no hosted RT claim)
        run: |
          python tools/fetch_sakura.py
          cargo test --manifest-path sakura/Cargo.toml --locked
          cargo test --manifest-path sakura/Cargo.toml --locked --test scene -- --include-ignored
          cargo run --manifest-path sakura/Cargo.toml --locked --example scene_layout -- sakura-layout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-layout-Metal-host
          path: sakura-layout.txt
      - run: cargo fmt --manifest-path miniengine/Cargo.toml --check
      - run: cargo clippy --manifest-path miniengine/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test MiniEngine intake, CLI and Metal compute units (no hosted RT)
        run: |
          python tools/fetch_miniengine.py
          cargo test --manifest-path miniengine/Cargo.toml --locked -- --nocapture
          cargo test --manifest-path miniengine/Cargo.toml --locked --test model -- --ignored
          cargo test --manifest-path miniengine/Cargo.toml --locked --test dds -- --ignored
          python tools/run_miniengine_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: miniengine-geometry-Mac
          path: miniengine-geometry.json
      - name: Exercise a real Metal device
        if: runner.os == 'macOS'
        env:
          ALKYHOL_PPM: triangle.ppm
        run: cargo run --manifest-path graphics/Cargo.toml --locked --example hello_triangle
      - name: Copy a patterned resource on Metal
        if: runner.os == 'macOS'
        run: cargo run --manifest-path graphics/Cargo.toml --locked --example copy_resource
      - name: Observe the D3D12 comparison scenario on Metal
        if: runner.os == 'macOS'
        run: python tools/run_graphics_contract.py --output graphics-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-contract-${{ runner.os }}
          path: graphics-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-${{ runner.os }}
          path: |
            triangle.ppm
            graphics/Cargo.lock
  graphics-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Observe Sakura placement on native MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /fp:strict /W4 /WX sakura/reference/scene_layout.cpp /Fe:sakura-layout.exe
          sakura-layout.exe sakura-layout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-layout-Windows
          path: sakura-layout.txt
      - name: Observe native MSVC H3D struct ABI and expanded geometry bytes
        run: python tools/run_miniengine_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: miniengine-geometry-Windows
          path: miniengine-geometry.json
      - name: Execute actual Windows SDK D3D12 with explicit WARP
        run: python tools/run_graphics_contract.py --output graphics-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-contract-Windows
          path: graphics-contract.json
  compare-graphics:
    needs: [graphics, graphics-reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graphics-contract-*
          path: observations
      - name: Compare every observed pixel against native D3D12 WARP
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          from tools.graphics_contract import validate_observation
          reports = [json.loads(p.read_text()) for p in Path('observations').glob('*/graphics-contract.json')]
          assert len(reports) == 2, reports
          assert {r['backend'] for r in reports} == {'native D3D12 WARP', 'Alkyhol direct Metal'}
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert all(r['schema_version'] == 1 and r['source_revision'] == revision and r['tracked_tree_clean'] is True for r in reports)
          for report in reports:
              validate_observation(json.dumps(report['observation']))
          baseline = next(r['observation'] for r in reports if r['backend'] == 'native D3D12 WARP')
          assert all(r['observation'] == baseline for r in reports)
          print('All 1040 source and 1040 destination RGBA8 bytes agree on D3D12 WARP and direct Metal')
          PY

  compare-sakura-layout:
    needs: [graphics, graphics-reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sakura-layout-*
          path: placements
      - name: Compare all instance material IDs and float bits with native MSVC
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files=list(Path('placements').glob('*/sakura-layout.txt'))
          assert len(files)==2,files
          observed=[p.read_bytes() for p in files]
          assert all(len(b)==13525*49 and len(b.splitlines())==13525 for b in observed)
          assert observed[0]==observed[1], 'Sakura instance float bits differ from native MSVC'
          print('All 13,525 instance records agree, SHA256:',hashlib.sha256(observed[0]).hexdigest())
          PY

  compare-miniengine-geometry:
    needs: [graphics, graphics-reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: miniengine-geometry-*
          path: geometry
      - name: Compare all expanded Sponza attribute bytes with native MSVC
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in Path('geometry').glob('*/miniengine-geometry.json')]
          assert len(reports)==2
          assert {r['backend'] for r in reports}=={'native MSVC H3D ABI','Rust H3D reader'}
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert all(r['revision']==revision and r['tracked_tree_clean'] is True for r in reports)
          for key in ['scenario','asset_sha256','expanded_bytes','expanded_sha256']:
              assert reports[0][key]==reports[1][key],key
          assert reports[0]['expanded_bytes']==46858664
          print('Native MSVC and Rust agree on every expanded Sponza geometry/attribute byte:',reports[0]['expanded_sha256'])
          PY
