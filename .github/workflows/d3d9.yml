name: D3D9 binary GPU comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metal-producer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned open renderer dependencies
        run: |
          cargo fetch --manifest-path pe/Cargo.toml --locked
          cargo fetch --manifest-path d3d9/Cargo.toml --locked
      - name: Validate portable renderer and execute actual Metal pixels
        run: |
          python -m unittest discover -s tests -p test_d3d9_observer.py -v
          cargo fmt --manifest-path d3d9/Cargo.toml --check
          cargo test --manifest-path d3d9/Cargo.toml --locked --offline
          cargo test --manifest-path d3d9/Cargo.toml --locked --offline -- --ignored --nocapture
          cargo clippy --manifest-path d3d9/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Build the pinned open legacy shader compiler
        run: |
          brew install bison flex make
          python tools/build_d3d9_shader_compiler.py
          python tools/check_d3d9_shader_artifacts.py
      - name: Execute literal legacy shader bytecode through PE32 COM and Metal
        run: |
          python tools/observe_d3d9_create_device.py --shaders
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --shaders --host
      - name: Execute legacy texture and sRGB sampling through PE32 COM
        run: |
          python tools/observe_d3d9_create_device.py --textures
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --textures --host
      - name: Execute Bink L8 luminance planes through original legacy shaders
        run: |
          python tools/observe_d3d9_create_device.py --l8
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --l8 --host
      - name: Execute the SM2 and 128-arithmetic-slot prerequisite witness
        run: |
          python tools/observe_d3d9_create_device.py --model2
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --model2 --host
      - name: Execute render-state changes through PE32 COM
        run: |
          python tools/observe_d3d9_create_device.py --states
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --states --host
      - name: Execute render-target allocation, binding, retention and sampling
        run: |
          python tools/observe_d3d9_create_device.py --targets
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --targets --host
      - name: Execute DAO SHORT2, D3DCOLOR and UBYTE4N vertex fetch
        run: |
          python tools/observe_d3d9_create_device.py --packed
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --packed --host
      - name: Execute real D16 depth creation, clear and occlusion
        run: |
          python tools/observe_d3d9_create_device.py --depth
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --depth --host
      - name: Execute actual indexed draws through retained PE32 buffers
        run: |
          python tools/observe_d3d9_create_device.py --indexed
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --indexed --host
      - name: Execute original DXT5 blocks and all mip surfaces through PE32
        run: |
          python tools/observe_d3d9_create_device.py --bc3
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --bc3 --host
      - name: Compile unchanged Microsoft Tutorial 01 bodies into a single PE
        run: python tools/observe_d3d9_create_device.py
      - name: Execute that PE through binary COM and Metal
        run: python tools/observe_d3d9_create_device.py --host
      - name: Execute display enumeration and conservative capability queries reached by DAO
        run: |
          python tools/observe_d3d9_create_device.py --queries
          python tools/observe_d3d9_create_device.py --queries --host
      - name: Compile and execute unchanged Microsoft Tutorial 02 vertex-buffer bodies
        run: |
          python tools/observe_d3d9_create_device.py --vertices
          python tools/observe_d3d9_create_device.py --vertices --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-open-compiler-build
          path: |
            local/tools/shader9/build.log
            local/tools/shader9/build/config.log
            local/tools/shader9/compiler.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-identical-pe
          path: |
            local/pe/d3d9-microtests/d3d9-l8.exe
            local/pe/d3d9-microtests/d3d9-l8-inputs.json
            local/pe/d3d9-microtests/d3d9-l8-host.json
            local/pe/d3d9-microtests/d3d9-packed.exe
            local/pe/d3d9-microtests/d3d9-packed-inputs.json
            local/pe/d3d9-microtests/d3d9-packed-host.json
            local/pe/d3d9-microtests/d3d9-bc3.exe
            local/pe/d3d9-microtests/d3d9-bc3-inputs.json
            local/pe/d3d9-microtests/d3d9-bc3-host.json
            local/pe/d3d9-microtests/d3d9-indexed.exe
            local/pe/d3d9-microtests/d3d9-indexed-inputs.json
            local/pe/d3d9-microtests/d3d9-indexed-host.json
            local/pe/d3d9-microtests/d3d9-depth.exe
            local/pe/d3d9-microtests/d3d9-depth-inputs.json
            local/pe/d3d9-microtests/d3d9-depth-host.json
            local/pe/d3d9-microtests/d3d9-targets.exe
            local/pe/d3d9-microtests/d3d9-targets-inputs.json
            local/pe/d3d9-microtests/d3d9-targets-host.json
            local/pe/d3d9-microtests/d3d9-states.exe
            local/pe/d3d9-microtests/d3d9-states-inputs.json
            local/pe/d3d9-microtests/d3d9-states-host.json
            local/pe/d3d9-microtests/d3d9-model2.exe
            local/pe/d3d9-microtests/d3d9-model2-inputs.json
            local/pe/d3d9-microtests/d3d9-model2-host.json
            local/pe/d3d9-microtests/d3d9-textures.exe
            local/pe/d3d9-microtests/d3d9-textures-inputs.json
            local/pe/d3d9-microtests/d3d9-textures-host.json
            local/pe/d3d9-microtests/d3d9-shaders.exe
            local/pe/d3d9-microtests/d3d9-shaders-inputs.json
            local/pe/d3d9-microtests/d3d9-shaders-host.json
            local/pe/d3d9-microtests/d3d9-create-device.exe
            local/pe/d3d9-microtests/d3d9-create-device-inputs.json
            local/pe/d3d9-microtests/d3d9-create-device-host.json
            local/pe/d3d9-microtests/d3d9-vertices.exe
            local/pe/d3d9-microtests/d3d9-vertices-inputs.json
            local/pe/d3d9-microtests/d3d9-vertices-host.json
            local/pe/d3d9-microtests/d3d9-queries.exe
            local/pe/d3d9-microtests/d3d9-queries-inputs.json
            local/pe/d3d9-microtests/d3d9-queries-host.json
          if-no-files-found: error
  native-d3d9:
    needs: metal-producer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          name: d3d9-identical-pe
          path: local/pe/d3d9-microtests
      - name: Check structures and virtual slots against the independent Windows SDK
        run: cl /nologo /c /W4 /WX /std:c++17 pe/fixtures/d3d9/sdk-layout.cpp /Folocal/pe/d3d9-microtests/sdk-layout.obj
      - name: Execute the identical PE on native Windows D3D9 and compare every reported pixel
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --native
      - name: Compare identical mode/capability query PE on native Windows D3D9
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --queries --native
      - name: Compare identical triangle PE on native Windows D3D9
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --vertices --native
      - name: Compare literal legacy shader bytecode and every pixel on native Windows
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --shaders --native
      - name: Compare exact legacy texture and sRGB frames on native Windows
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --textures --native
      - name: Compare exact L8 movie-plane sampling on native Windows
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --l8 --native
      - name: Compare exact SM2 128-slot frames on native Windows
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --model2 --native
      - name: Compare render-state blending and color masks on native Windows
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --states --native
      - name: Compare exact DXT5 surfaces, mip blocks, color spaces and full frames
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --bc3 --native
      - name: Compare packed vertex fetch and every rendered pixel
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --packed --native
      - name: Compare every pixel and ABI field of the indexed buffer witness
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --indexed --native
      - name: Compare exact D16 depth surfaces and occlusion
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --depth --native
      - name: Compare exact render-target contents and COM lifetimes
        if: success() || failure()
        run: python tools/observe_d3d9_create_device.py --targets --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-native-observation
          path: local/pe/d3d9-microtests/native-*.json
          if-no-files-found: error

  vulkan-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the open Mesa Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Execute the same backend contracts through Vulkan software rendering
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile
          icd=next(pathlib.Path('/usr/share/vulkan/icd.d').glob('lvp*.json'))
          directory=tempfile.mkdtemp(prefix='alkyhol-vulkan-')
          env=dict(os.environ,VK_ICD_FILENAMES=str(icd),XDG_RUNTIME_DIR=directory)
          subprocess.run(['cargo','test','--manifest-path','d3d9/Cargo.toml','--locked','--','--include-ignored','--nocapture'],env=env,check=True)
          PY
