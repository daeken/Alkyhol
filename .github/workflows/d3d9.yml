name: D3D9 binary GPU comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metal-producer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned open renderer dependencies
        run: |
          cargo fetch --manifest-path pe/Cargo.toml --locked
          cargo fetch --manifest-path d3d9/Cargo.toml --locked
      - name: Validate bounded Rosetta address-hole allocation
        run: |
          mkdir -p local/pe
          xcrun clang -arch x86_64 -mmacosx-version-min=14.0 -Wall -Wextra -Werror -Wl,-pagezero_size,0x1000 pe/probe_low_memory.c pe/src/memory_host32.c -o local/pe/probe-low-memory
          arch -x86_64 local/pe/probe-low-memory
          xcrun clang -arch x86_64 -Wall -Wextra -Werror -c pe/src/memory_host32.c -o local/pe/memory-host32.o
          rustc --edition=2024 --target x86_64-apple-darwin -A dead_code pe/probe_present_memory.rs -C link-arg=local/pe/memory-host32.o -o local/pe/probe-present-memory
          arch -x86_64 local/pe/probe-present-memory
      - name: Validate portable renderer and execute actual Metal pixels
        run: |
          python -m unittest discover -s tests -p test_d3d9_observer.py -v
          cargo fmt --manifest-path d3d9/Cargo.toml --check
          cargo test --manifest-path d3d9/Cargo.toml --locked --offline
          cargo test --manifest-path d3d9/Cargo.toml --locked --offline -- --ignored --nocapture
          cargo clippy --manifest-path d3d9/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Build the pinned open legacy shader compiler
        run: |
          brew install bison flex make
          python tools/build_d3d9_shader_compiler.py
          python tools/check_d3d9_shader_artifacts.py
      - name: Execute literal legacy shader bytecode through PE32 COM and Metal
        run: |
          python tools/observe_d3d9_create_device.py --shaders
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --shaders --host
      - name: Execute D3D9 NULL texture samples and bound/unbound transitions
        run: |
          python tools/observe_d3d9_create_device.py --null-textures
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --null-textures --host
      - name: Execute legacy texture and sRGB sampling through PE32 COM
        run: |
          python tools/observe_d3d9_create_device.py --textures
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --textures --host
      - name: Execute original renderer A8 and A4R4G4B4 font texture requests
        run: |
          python tools/observe_d3d9_create_device.py --fonts
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --fonts --host
      - name: Execute original DAO cube resource and surface-alias contracts
        run: |
          python tools/observe_d3d9_cube.py
          python tools/observe_d3d9_cube.py --host
      - name: Execute real small-PAGEZERO allocator packing and protection classes
        run: |
          mkdir -p local/pe
          cargo rustc --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline --lib --profile test --message-format=json -- -C link-arg=-Wl,-pagezero_size,0x1000 > local/pe/storage-test-build.jsonl
          python - <<'PYTEST'
          import json,subprocess
          from pathlib import Path
          rows=[json.loads(line) for line in Path('local/pe/storage-test-build.jsonl').read_text().splitlines() if line.startswith('{')]
          exe=[row['executable'] for row in rows if row.get('reason')=='compiler-artifact' and row.get('executable')][-1]
          subprocess.run([exe,'--ignored','--exact','runtime32::d3d9_32::tests::actual_small_guest_allocations_pack_disjoint_bytes_and_keep_protection_classes'],check=True)
          PYTEST
      - name: Execute original save-path dynamic BC1 and scaled pixel transfers
        run: |
          python tools/observe_d3d9_cube.py --save-resources
          python tools/observe_d3d9_cube.py --save-resources --host
      - name: Execute actual advertised render target allocation and binding
        run: |
          python tools/observe_d3d9_cube.py --render-caps
          python tools/observe_d3d9_cube.py --render-caps --host
      - name: Execute DAO texture storage beyond the former mapping limit
        run: |
          python tools/observe_d3d9_cube.py --texture-storage
          python tools/observe_d3d9_cube.py --texture-storage --host
      - name: Execute DAO vertex and index buffer storage rollover
        run: |
          python tools/observe_d3d9_cube.py --buffer-storage
          python tools/observe_d3d9_cube.py --buffer-storage --host
      - name: Execute DAO COM header allocation and retained binding rollover
        run: |
          python tools/observe_d3d9_cube.py --com-headers
          python tools/observe_d3d9_cube.py --com-headers --host
      - name: Execute actual DAO half-precision vertex declaration formats
        run: |
          python tools/observe_d3d9_create_device.py --half
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --half --host
      - name: Execute DAO separate vertex streams and retained sources
        run: |
          python tools/observe_d3d9_create_device.py --streams
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --streams --host
      - name: Execute DAO signed short4 vertex declarations
        run: |
          python tools/observe_d3d9_create_device.py --short4
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --short4 --host
      - name: Execute staged texture families and rectangular color transfers
        run: |
          python tools/observe_d3d9_create_device.py --transfers
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --transfers --host
      - name: Execute real volume mips, COM aliases and original-style sampler3D
        run: |
          python tools/observe_d3d9_create_device.py --volume
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --volume --host
      - name: Execute original-style fixed XYZ query geometry
        run: |
          python tools/observe_d3d9_create_device.py --xyz-query
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --xyz-query --host
      - name: Execute original DAO alpha-test threshold and rejection
        run: |
          python tools/observe_d3d9_create_device.py --alpha-test
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --alpha-test --host
      - name: Execute caller-memory draws and binding reset
        run: |
          python tools/observe_d3d9_create_device.py --user-draw
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --user-draw --host
      - name: Execute DAO precise occlusion queries and overlapping scopes
        run: |
          python tools/observe_d3d9_create_device.py --occlusion
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --occlusion --host
      - name: Execute DAO float depth bias without changing source shader bodies
        run: |
          python tools/observe_d3d9_create_device.py --bias
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --bias --host
      - name: Execute fresh stencil draw and nondefault clear depth ranges
        run: |
          python tools/observe_d3d9_create_device.py --fresh-stencil
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --fresh-stencil --host
      - name: Execute original renderer stencil mask operations
        run: |
          python tools/observe_d3d9_create_device.py --stencil
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --stencil --host
      - name: Execute original renderer full-surface StretchRect copies
        run: |
          python tools/observe_d3d9_create_device.py --stretch
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --stretch --host
      - name: Execute actual D3DX transform storage and premultiplication
        run: |
          python tools/observe_d3d9_create_device.py --transforms
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --transforms --host
      - name: Execute POSITIONT RHW, strip topology and subviewport clipping
        run: |
          python tools/observe_d3d9_create_device.py --transformed
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --transformed --host
      - name: Execute Bink L8 luminance planes through original legacy shaders
        run: |
          python tools/observe_d3d9_create_device.py --l8
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --l8 --host
      - name: Execute the SM2 and 128-arithmetic-slot prerequisite witness
        run: |
          python tools/observe_d3d9_create_device.py --model2
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --model2 --host
      - name: Execute render-state changes through PE32 COM
        run: |
          python tools/observe_d3d9_create_device.py --states
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --states --host
      - name: Execute render-target allocation, binding, retention and sampling
        run: |
          python tools/observe_d3d9_create_device.py --targets
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --targets --host
      - name: Execute DAO SHORT2, D3DCOLOR and UBYTE4N vertex fetch
        run: |
          python tools/observe_d3d9_create_device.py --packed
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --packed --host
      - name: Execute real D16 depth creation, clear and occlusion
        run: |
          python tools/observe_d3d9_create_device.py --depth
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --depth --host
      - name: Execute actual indexed draws through retained PE32 buffers
        run: |
          python tools/observe_d3d9_create_device.py --indexed
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --indexed --host
      - name: Execute original DXT5 blocks and all mip surfaces through PE32
        run: |
          python tools/observe_d3d9_create_device.py --bc3
          ALKYHOL_D3D9_SHADER_COMPILER="$PWD/local/tools/shader9/alkyhol-shader9" ALKYHOL_D3D9_SHADER_DIRECTORY="$PWD/local/d3d9/compiled-owned" python tools/observe_d3d9_create_device.py --bc3 --host
      - name: Compile unchanged Microsoft Tutorial 01 bodies into a single PE
        run: python tools/observe_d3d9_create_device.py
      - name: Execute that PE through binary COM and Metal
        run: python tools/observe_d3d9_create_device.py --host
      - name: Execute display enumeration and conservative capability queries reached by DAO
        run: |
          python tools/observe_d3d9_create_device.py --queries
          python tools/observe_d3d9_create_device.py --queries --host
      - name: Compile and execute unchanged Microsoft Tutorial 02 vertex-buffer bodies
        run: |
          python tools/observe_d3d9_create_device.py --vertices
          python tools/observe_d3d9_create_device.py --vertices --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-open-compiler-build
          path: |
            local/tools/shader9/build.log
            local/tools/shader9/build/config.log
            local/tools/shader9/compiler.json
          if-no-files-found: warn
