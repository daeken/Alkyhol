name: Native x87 arithmetic evidence
on:
  push:
    paths:
      - jit32/tests/x87_arithmetic_reference.c
      - jit32/tests/x87_memory_reference.c
      - jit32/tests/x87_atan2_reference.c
      - jit32/tests/x87_remainder_reference.c
      - tools/observe_jit32_remainder_native.py
      - tools/observe_jit32_x87_arithmetic_native.py
      - .github/workflows/jit32-x87.yml
  pull_request:
    paths:
      - jit32/tests/x87_arithmetic_reference.c
      - jit32/tests/x87_memory_reference.c
      - jit32/tests/x87_atan2_reference.c
      - jit32/tests/x87_remainder_reference.c
      - tools/observe_jit32_remainder_native.py
      - tools/observe_jit32_x87_arithmetic_native.py
      - .github/workflows/jit32-x87.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe owned x87 arithmetic assembly on native x64 Windows
        run: python tools/observe_jit32_x87_arithmetic_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-x87-arithmetic
          path: local/jit32/native-x87-arithmetic-reference/
          if-no-files-found: error

  native-memory-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe owned memory arithmetic on native x64 Windows
        run: python tools/observe_jit32_x87_arithmetic_native.py --memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-x87-memory
          path: local/jit32/native-x87-memory-reference/
          if-no-files-found: error

  native-atan2-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe owned FPATAN assembly on native x64 Windows
        run: python tools/observe_jit32_x87_arithmetic_native.py --atan2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-x87-atan2
          path: local/jit32/native-x87-atan2-reference/
          if-no-files-found: error

  native-remainder-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Observe complete finite FPREM and FPREM1 on native x64 Windows
        run: python tools/observe_jit32_remainder_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-x87-remainder
          path: local/jit32/native-remainder-reference/
          if-no-files-found: error
