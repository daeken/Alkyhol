      - name: Execute legacy cookie/compiler-GS cases normally and rebased
        run: python tools/run_pe32_load_config.py --directory local/pe/pe32-load-config --output local/pe/pe32-load-config-alkyhol.json
      - uses: actions/upload-artifact@v4
