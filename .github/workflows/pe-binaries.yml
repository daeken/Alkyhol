name: PE binary execution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pe32-startup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Microtests for blockers reached during DAO startup; no game files
        run: python tools/check_pe32_startup.py
      - name: Inspect owned PE resources for the DAO activation-context blocker
        run: python tools/check_pe32_activation.py
      - name: Execute the activation lookup bridge and reject unknown EXE/DLL contexts
        run: python tools/check_pe32_activation_miss.py
      - name: Execute genuine file-backed EXE and DLL path queries, including during DLL startup
        run: python tools/check_pe32_module_paths.py
      - name: Execute an explicit backed system-directory profile without guessing DLL paths
        run: python tools/check_pe32_system_directory.py
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-startup-microtests
          path: |
            local/pe/startup-microtests/*.exe
            local/pe/startup-microtests/owned-context.dll
            local/pe/startup-microtests/module-path.dll
            local/pe/startup-microtests/microtest-inputs.json
            local/pe/startup-microtests/microtest-results.json
            local/pe/startup-microtests/activation-inputs.json
            local/pe/startup-microtests/activation-host.json
            local/pe/startup-microtests/activation-miss-inputs.json
            local/pe/startup-microtests/activation-miss-host.json
            local/pe/startup-microtests/module-path-inputs.json
            local/pe/startup-microtests/module-path-host.json
            local/pe/startup-microtests/system-directory-inputs.json
            local/pe/startup-microtests/system-directory-host.json
  native-pe32-startup:
    needs: pe32-startup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pe32-startup-microtests
          path: local/pe/startup-microtests
      - name: Check identical DAO startup microtests against frozen native captures
        run: python tools/check_pe32_startup.py --native
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Check activation layouts independently against the Windows SDK
        run: cl /nologo /c /W4 /WX /std:c++17 pe/fixtures/pe32-startup/activation-layout.cpp /Folocal/pe/startup-microtests/activation-layout.obj
      - name: Observe actual Win32 activation-context behavior using the identical owned PE
        run: python tools/check_pe32_activation.py --native
      - name: Compare identical empty-context lookup PE with the Rust bridge
        run: python tools/check_pe32_activation_miss.py --native
      - name: Compare identical module/path PE and DLL against real Windows loading
        run: python tools/check_pe32_module_paths.py --native
      - name: Observe real Win32 system-directory sizing and output against the identical PE
        run: python tools/check_pe32_system_directory.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pe32-startup-native-results
          path: local/pe/startup-microtests/native-*.json
  alkyhol-pe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --manifest-path pe/Cargo.toml --check
      - run: rustfmt --edition 2024 --check pe/launcher.rs
      - run: cargo test --manifest-path pe/Cargo.toml --locked --offline
      - run: cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline
      - run: cargo clippy --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline --all-targets -- -D warnings
      - name: Build an actual Windows executable once with open LLVM
        run: python tools/build_pe_fixture.py
      - name: Execute unchanged PE machine code through Win64 bridges
        run: python tools/run_pe_probe.py --fixture local/pe/fixture/contract.exe --output local/pe/alkyhol.json
      - name: Fetch verified released Windows pkg-config without rebuilding it
        run: python tools/fetch_uconfig_binary.py
      - name: Execute real released PE package queries, listing and quoted Unicode arguments
        run: python tools/run_uconfig_binary.py --binary local/pe/u-config/pkg-config.exe --output local/pe/u-config-alkyhol.json
      - name: Fetch and execute a second unchanged released Windows application
        run: |
          python tools/fetch_make2compdb_binary.py
          python tools/run_make2compdb_binary.py --binary local/pe/make2compdb/make2compdb.exe --output local/pe/make2compdb-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-release
          path: |
            local/pe/make2compdb/make2compdb.exe
            local/pe/make2compdb/make2compdb.c
            local/pe/make2compdb/UNLICENSE
            local/pe/make2compdb/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-alkyhol
          path: local/pe/make2compdb-alkyhol.json
      - name: Observe UTF-8 replacement strict validation and exact byte/unit boundaries
        run: |
          python tools/build_pe_text_conversion.py
          python tools/run_pe_text_conversion.py --fixture local/pe/text-conversion/text-conversion.exe --output local/pe/text-conversion-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-fixture
          path: |
            local/pe/text-conversion/text-conversion.exe
            local/pe/text-conversion/text-conversion-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-alkyhol
          path: local/pe/text-conversion-alkyhol.json
      - name: Build owned DLL and inspect export metadata without entering it
        run: |
          python tools/build_pe_export_fixture.py
          python tools/run_pe_exports.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/exports-metadata.json
      - name: Execute unchanged released peports over the frozen owned EXE and DLL
        run: |
          python tools/fetch_peports_binary.py
          python tools/run_peports_binary.py --binary local/pe/peports/peports.exe --output local/pe/peports-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-release
          path: |
            local/pe/peports/peports.exe
            local/pe/peports/peports.c
            local/pe/peports/UNLICENSE
            local/pe/peports/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-alkyhol
          path: local/pe/peports-alkyhol.json
      - name: Execute the original released i386 peports through real Win32 startup and process exit
        run: |
          python tools/fetch_peports32_binary.py
          python tools/run_peports32_binary.py --binary local/pe/peports32/peports.exe --output local/pe/peports32-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports32-release
          path: |
            local/pe/peports32/peports.exe
            local/pe/peports32/peports.c
            local/pe/peports32/UNLICENSE
            local/pe/peports32/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports32-alkyhol
          path: local/pe/peports32-alkyhol.json
      - name: Execute a complete PE32 static EXE and DLL graph through process termination
        run: |
          python tools/build_pe32_process.py
          python tools/run_pe32_process.py --directory local/pe/pe32-process --output local/pe/pe32-process-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-process-fixture
          path: |
            local/pe/pe32-process/*.dll
            local/pe/pe32-process/program.exe
            local/pe/pe32-process/pe32-process-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-process-alkyhol
          path: local/pe/pe32-process-alkyhol.json
      - name: Check public process DLL arguments and metadata-only inspection
        run: python tools/check_pe32_process_launcher.py --directory local/pe/pe32-process --process-report local/pe/pe32-process-alkyhol.json --output local/pe/pe32-process-launcher.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-process-launcher
          path: local/pe/pe32-process-launcher.json
      - name: Execute the frozen owned DLL through Alkyhol, including DllMain and exports
        run: python tools/run_pe_library.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/library-runtime.json
      - name: Execute a genuine failed DLL initializer and its ordered cleanup with imported APIs
        run: |
          python tools/build_pe_failed_attach.py
          python tools/run_pe_failed_attach.py --dll local/pe/failed-attach/alkyhol_failed_attach.dll --output local/pe/failed-attach-alkyhol.json
      - name: Link a real consumer DLL to the unchanged frozen dependency and execute cross-DLL calls
        run: |
          python tools/build_pe_dependent.py
          python tools/run_pe_dependent.py --directory local/pe/dependent --output local/pe/dependent-alkyhol.json
      - name: Execute genuine mixed named and ordinal code/data imports and ordinal forwarders
        run: |
          python tools/build_pe_ordinal.py
          python tools/run_pe_ordinal.py --directory local/pe/ordinal --output local/pe/ordinal-alkyhol.json
      - name: Load an unsorted closed DLL graph with shared dependencies from unchanged frozen binaries
        run: |
          python tools/build_pe_library_set.py
          python tools/run_pe_library_set.py --directory local/pe/library-set --output local/pe/library-set-alkyhol.json
      - name: Execute unchanged PE virtual COM calls through all five Win64 ID3DBlob slots
        run: |
          python tools/build_pe_binary_com.py
          python tools/run_pe_binary_com.py --fixture local/pe/binary-com/binary-com.exe --output local/pe/binary-com-alkyhol.json
      - name: Execute unchanged PE D3D12 serializers and returned Win64 COM blobs
        run: |
          python tools/build_pe_root_signatures.py
          python tools/run_pe_root_signatures.py --fixture local/pe/root-signatures/root-signatures.exe --output local/pe/root-signatures-alkyhol.json
      - name: Enter an unchanged EXE importing named and ordinal code/data from the frozen DLL
        run: |
          python tools/build_pe_linked_image.py
          python tools/run_pe_linked_image.py --directory local/pe/linked-image --output local/pe/linked-image-alkyhol.json
      - name: Execute real guest module handle and named/ordinal export lookup APIs
        run: |
          python tools/build_pe_dynamic_lookup.py
          python tools/run_pe_dynamic_lookup.py --directory local/pe/dynamic-lookup --output local/pe/dynamic-lookup-alkyhol.json
      - name: Execute and rewrite code emitted by an unchanged Windows PE through real memory APIs
        run: |
          python tools/build_pe_generated_code.py
          python tools/run_pe_generated_code.py --fixture local/pe/generated-code/generated-code.exe --output local/pe/generated-code-alkyhol.json
      - name: Register look up and remove dynamic function metadata for real emitted Win64 code
        run: |
          python tools/build_pe_function_tables.py
          python tools/run_pe_function_tables.py --fixture local/pe/function-tables/function-tables.exe --output local/pe/function-tables-alkyhol.json
      - name: Manually unwind captured fields of real active Win64 assembly frames
        run: |
          python tools/build_pe_virtual_unwind.py
          python tools/run_pe_virtual_unwind.py --fixture local/pe/virtual-unwind/virtual-unwind.exe --output local/pe/virtual-unwind-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-fixture
          path: |
            local/pe/virtual-unwind/virtual-unwind.exe
            local/pe/virtual-unwind/virtual-unwind-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-alkyhol
          path: local/pe/virtual-unwind-alkyhol.json
      - name: Observe static DLL metadata throughout successful and rejected initialization
        run: |
          python tools/build_pe_registered_dll.py
          python tools/run_pe_registered_dll.py --directory local/pe/registered-dll --output local/pe/registered-dll-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-registered-dll-fixture
          path: |
            local/pe/registered-dll/accepted.dll
            local/pe/registered-dll/rejected.dll
            local/pe/registered-dll/registered-dll-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-registered-dll-alkyhol
          path: local/pe/registered-dll-alkyhol.json
      - name: Observe assembler-generated static metadata and actual caller restoration
        run: |
          python tools/build_pe_static_functions.py
          python tools/run_pe_static_functions.py --fixture local/pe/static-functions/static-functions.exe --output local/pe/static-functions-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-static-functions-fixture
          path: |
            local/pe/static-functions/static-functions.exe
            local/pe/static-functions/static-functions-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-static-functions-alkyhol
          path: local/pe/static-functions-alkyhol.json
      - name: Execute unchanged i386 PE32 with real stdcall API gates
        run: |
          python tools/build_pe32_fixture.py
          python tools/run_pe32_probe.py --fixture local/pe/pe32/pe32.exe --output local/pe/pe32-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-pe32-fixture
          path: |
            local/pe/pe32/pe32.exe
            local/pe/pe32/pe32-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-pe32-alkyhol
          path: local/pe/pe32-alkyhol.json
      - name: Build owned executable-export observer for independent native API observation
        run: python tools/build_pe32_exports.py
      - name: Execute original PE32 self-module export calls normally and rebased
        run: python tools/run_pe32_exports.py --fixture local/pe/pe32-exports/alkyhol_pe32_exports.exe --output local/pe/pe32-exports-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-exports-alkyhol
          path: local/pe/pe32-exports-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-exports-fixture
          path: |
            local/pe/pe32-exports/alkyhol_pe32_exports.exe
            local/pe/pe32-exports/pe32-exports-fixture.json
      - name: Build owned FS/TEB observer for independent native execution
        run: python tools/build_pe32_teb.py
      - name: Execute original FS/TEB observer normally rebased and twice on one image
        run: python tools/run_pe32_teb.py --fixture local/pe/pe32-teb/pe32-teb.exe --output local/pe/pe32-teb-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-teb-alkyhol
          path: local/pe/pe32-teb-alkyhol.json
      - uses: actions/upload-artifact@v4
