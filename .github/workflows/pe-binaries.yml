            local/pe/virtual-unwind/virtual-unwind-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-alkyhol
          path: local/pe/virtual-unwind-alkyhol.json
      - name: Observe static DLL metadata throughout successful and rejected initialization
        run: |
          python tools/build_pe_registered_dll.py
          python tools/run_pe_registered_dll.py --directory local/pe/registered-dll --output local/pe/registered-dll-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-registered-dll-fixture
          path: |
            local/pe/registered-dll/accepted.dll
            local/pe/registered-dll/rejected.dll
            local/pe/registered-dll/registered-dll-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-registered-dll-alkyhol
          path: local/pe/registered-dll-alkyhol.json
      - name: Observe assembler-generated static metadata and actual caller restoration
        run: |
          python tools/build_pe_static_functions.py
