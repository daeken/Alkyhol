name: PE binary execution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  alkyhol-pe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --manifest-path pe/Cargo.toml --check
      - run: rustfmt --edition 2024 --check pe/launcher.rs
      - run: cargo test --manifest-path pe/Cargo.toml --locked --offline
      - run: cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline
      - run: cargo clippy --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline --all-targets -- -D warnings
      - name: Build an actual Windows executable once with open LLVM
        run: python tools/build_pe_fixture.py
      - name: Execute unchanged PE machine code through Win64 bridges
        run: python tools/run_pe_probe.py --fixture local/pe/fixture/contract.exe --output local/pe/alkyhol.json
      - name: Fetch verified released Windows pkg-config without rebuilding it
        run: python tools/fetch_uconfig_binary.py
      - name: Execute real released PE package queries, listing and quoted Unicode arguments
        run: python tools/run_uconfig_binary.py --binary local/pe/u-config/pkg-config.exe --output local/pe/u-config-alkyhol.json
      - name: Fetch and execute a second unchanged released Windows application
        run: |
          python tools/fetch_make2compdb_binary.py
          python tools/run_make2compdb_binary.py --binary local/pe/make2compdb/make2compdb.exe --output local/pe/make2compdb-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-release
          path: |
            local/pe/make2compdb/make2compdb.exe
            local/pe/make2compdb/make2compdb.c
            local/pe/make2compdb/UNLICENSE
            local/pe/make2compdb/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-alkyhol
          path: local/pe/make2compdb-alkyhol.json
      - name: Observe UTF-8 replacement strict validation and exact byte/unit boundaries
        run: |
          python tools/build_pe_text_conversion.py
          python tools/run_pe_text_conversion.py --fixture local/pe/text-conversion/text-conversion.exe --output local/pe/text-conversion-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-fixture
          path: |
            local/pe/text-conversion/text-conversion.exe
            local/pe/text-conversion/text-conversion-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-alkyhol
          path: local/pe/text-conversion-alkyhol.json
      - name: Build owned DLL and inspect export metadata without entering it
        run: |
          python tools/build_pe_export_fixture.py
          python tools/run_pe_exports.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/exports-metadata.json
      - name: Execute unchanged released peports over the frozen owned EXE and DLL
        run: |
          python tools/fetch_peports_binary.py
          python tools/run_peports_binary.py --binary local/pe/peports/peports.exe --output local/pe/peports-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-release
          path: |
            local/pe/peports/peports.exe
            local/pe/peports/peports.c
            local/pe/peports/UNLICENSE
            local/pe/peports/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-alkyhol
          path: local/pe/peports-alkyhol.json
      - name: Execute the frozen owned DLL through Alkyhol, including DllMain and exports
        run: python tools/run_pe_library.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/library-runtime.json
      - name: Execute a genuine failed DLL initializer and its ordered cleanup with imported APIs
        run: |
          python tools/build_pe_failed_attach.py
          python tools/run_pe_failed_attach.py --dll local/pe/failed-attach/alkyhol_failed_attach.dll --output local/pe/failed-attach-alkyhol.json
      - name: Link a real consumer DLL to the unchanged frozen dependency and execute cross-DLL calls
        run: |
          python tools/build_pe_dependent.py
          python tools/run_pe_dependent.py --directory local/pe/dependent --output local/pe/dependent-alkyhol.json
      - name: Execute genuine mixed named and ordinal code/data imports and ordinal forwarders
        run: |
          python tools/build_pe_ordinal.py
          python tools/run_pe_ordinal.py --directory local/pe/ordinal --output local/pe/ordinal-alkyhol.json
      - name: Load an unsorted closed DLL graph with shared dependencies from unchanged frozen binaries
        run: |
          python tools/build_pe_library_set.py
          python tools/run_pe_library_set.py --directory local/pe/library-set --output local/pe/library-set-alkyhol.json
      - name: Execute unchanged PE virtual COM calls through all five Win64 ID3DBlob slots
        run: |
          python tools/build_pe_binary_com.py
          python tools/run_pe_binary_com.py --fixture local/pe/binary-com/binary-com.exe --output local/pe/binary-com-alkyhol.json
      - name: Execute unchanged PE D3D12 serializers and returned Win64 COM blobs
        run: |
          python tools/build_pe_root_signatures.py
          python tools/run_pe_root_signatures.py --fixture local/pe/root-signatures/root-signatures.exe --output local/pe/root-signatures-alkyhol.json
      - name: Enter an unchanged EXE importing named and ordinal code/data from the frozen DLL
        run: |
          python tools/build_pe_linked_image.py
          python tools/run_pe_linked_image.py --directory local/pe/linked-image --output local/pe/linked-image-alkyhol.json
      - name: Execute real guest module handle and named/ordinal export lookup APIs
        run: |
          python tools/build_pe_dynamic_lookup.py
          python tools/run_pe_dynamic_lookup.py --directory local/pe/dynamic-lookup --output local/pe/dynamic-lookup-alkyhol.json
      - name: Execute and rewrite code emitted by an unchanged Windows PE through real memory APIs
        run: |
          python tools/build_pe_generated_code.py
          python tools/run_pe_generated_code.py --fixture local/pe/generated-code/generated-code.exe --output local/pe/generated-code-alkyhol.json
      - name: Register look up and remove dynamic function metadata for real emitted Win64 code
        run: |
          python tools/build_pe_function_tables.py
          python tools/run_pe_function_tables.py --fixture local/pe/function-tables/function-tables.exe --output local/pe/function-tables-alkyhol.json
      - name: Manually unwind captured fields of real active Win64 assembly frames
        run: |
          python tools/build_pe_virtual_unwind.py
          python tools/run_pe_virtual_unwind.py --fixture local/pe/virtual-unwind/virtual-unwind.exe --output local/pe/virtual-unwind-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-fixture
          path: |
            local/pe/virtual-unwind/virtual-unwind.exe
            local/pe/virtual-unwind/virtual-unwind-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-alkyhol
          path: local/pe/virtual-unwind-alkyhol.json
      - name: Observe assembler-generated static metadata and actual caller restoration
        run: |
          python tools/build_pe_static_functions.py
          python tools/run_pe_static_functions.py --fixture local/pe/static-functions/static-functions.exe --output local/pe/static-functions-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-static-functions-fixture
          path: |
            local/pe/static-functions/static-functions.exe
            local/pe/static-functions/static-functions-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-static-functions-alkyhol
          path: local/pe/static-functions-alkyhol.json
      - name: Restore saved integer/vector slots in real small and far-offset Win64 frames
        run: |
          python tools/build_pe_unwind_saves.py
          python tools/run_pe_unwind_saves.py --fixture local/pe/unwind-saves/unwind-saves.exe --output local/pe/unwind-saves-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-unwind-saves-fixture
          path: |
            local/pe/unwind-saves/unwind-saves.exe
            local/pe/unwind-saves/unwind-saves-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-unwind-saves-alkyhol
          path: local/pe/unwind-saves-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-function-tables-fixture
          path: |
            local/pe/function-tables/function-tables.exe
            local/pe/function-tables/function-tables-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-function-tables-alkyhol
          path: local/pe/function-tables-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-generated-code-fixture
          path: |
            local/pe/generated-code/generated-code.exe
            local/pe/generated-code/generated-code-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-generated-code-alkyhol
          path: local/pe/generated-code-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dynamic-lookup-fixture
          path: |
            local/pe/dynamic-lookup/dynamic-lookup.exe
            local/pe/dynamic-lookup/alkyhol_exports.dll
            local/pe/dynamic-lookup/dynamic-lookup-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dynamic-lookup-alkyhol
          path: local/pe/dynamic-lookup-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-linked-image-fixture
          path: |
            local/pe/linked-image/linked-image.exe
            local/pe/linked-image/alkyhol_exports.dll
            local/pe/linked-image/linked-image-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-linked-image-alkyhol
          path: local/pe/linked-image-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-root-signatures-fixture
          path: |
            local/pe/root-signatures/root-signatures.exe
            local/pe/root-signatures/root-signatures-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-root-signatures-alkyhol
          path: local/pe/root-signatures-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-binary-com-fixture
          path: |
            local/pe/binary-com/binary-com.exe
            local/pe/binary-com/binary-com-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-binary-com-alkyhol
          path: local/pe/binary-com-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-library-set-fixture
          path: |
            local/pe/library-set/alkyhol_exports.dll
            local/pe/library-set/alkyhol_dependent.dll
            local/pe/library-set/alkyhol_ordinal.dll
            local/pe/library-set/library-set-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-library-set-alkyhol
          path: local/pe/library-set-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-ordinal-fixture
          path: |
            local/pe/ordinal/alkyhol_exports.dll
            local/pe/ordinal/alkyhol_ordinal.dll
            local/pe/ordinal/ordinal-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-ordinal-alkyhol
          path: local/pe/ordinal-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dependent-fixture
          path: |
            local/pe/dependent/alkyhol_exports.dll
            local/pe/dependent/alkyhol_dependent.dll
            local/pe/dependent/dependent-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dependent-alkyhol
          path: local/pe/dependent-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-failed-attach-fixture
          path: |
            local/pe/failed-attach/alkyhol_failed_attach.dll
            local/pe/failed-attach/failed-attach-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-failed-attach-alkyhol
          path: local/pe/failed-attach-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-library-runtime
          path: local/pe/library-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-export-fixture
          path: |
            local/pe/export-fixture/alkyhol_exports.dll
            local/pe/export-fixture/exports-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-exports-metadata
          path: local/pe/exports-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: u-config-release
          path: |
            local/pe/u-config/pkg-config.exe
            local/pe/u-config/pkg-config.c
            local/pe/u-config/UNLICENSE
            local/pe/u-config/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: u-config-alkyhol
          path: local/pe/u-config-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-fixture
          path: |
            local/pe/fixture/contract.exe
            local/pe/fixture/fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-alkyhol
          path: local/pe/alkyhol.json
  native-windows-pe:
    needs: alkyhol-pe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pe-make2compdb-release
          path: local/pe/make2compdb
      - name: Execute the identical released make2compdb against native Windows kernel32 and shell32
        run: python tools/run_make2compdb_binary.py --binary local/pe/make2compdb/make2compdb.exe --output local/pe/make2compdb-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-windows
          path: local/pe/make2compdb-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-fixture
          path: local/pe/fixture
      - name: Execute the identical PE64 using real Windows kernel32
        run: python tools/run_pe_probe.py --fixture local/pe/fixture/contract.exe --output local/pe/windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-windows
          path: local/pe/windows.json
      - uses: actions/download-artifact@v4
        with:
          name: u-config-release
          path: local/pe/u-config
      - name: Execute the identical upstream released PE using native Windows
        run: python tools/run_uconfig_binary.py --binary local/pe/u-config/pkg-config.exe --output local/pe/u-config-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: u-config-windows
          path: local/pe/u-config-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-export-fixture
          path: local/pe/export-fixture
      - name: Resolve actual named, ordinal, data and forwarded exports using Windows
        run: python tools/run_pe_exports.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/exports-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-failed-attach-fixture
          path: local/pe/failed-attach
      - name: Observe real Windows failed DLL initialization and cleanup of the identical binary
        run: python tools/run_pe_failed_attach.py --dll local/pe/failed-attach/alkyhol_failed_attach.dll --output local/pe/failed-attach-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-dependent-fixture
          path: local/pe/dependent
      - name: Let the real Windows loader resolve and initialize the identical dependent DLLs
        run: python tools/run_pe_dependent.py --directory local/pe/dependent --output local/pe/dependent-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-ordinal-fixture
          path: local/pe/ordinal
      - name: Let Windows resolve identical mixed ordinal code/data thunks and forwarders
        run: python tools/run_pe_ordinal.py --directory local/pe/ordinal --output local/pe/ordinal-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-library-set-fixture
          path: local/pe/library-set
      - name: Observe Windows sharing a real dependency between the identical two consumer DLLs
        run: python tools/run_pe_library_set.py --directory local/pe/library-set --output local/pe/library-set-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-binary-com-fixture
          path: local/pe/binary-com
      - name: Execute the identical PE vtable caller against real Windows d3dcompiler_47 COM
        run: python tools/run_pe_binary_com.py --fixture local/pe/binary-com/binary-com.exe --output local/pe/binary-com-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-root-signatures-fixture
          path: local/pe/root-signatures
      - name: Execute the identical PE serializer client against real Windows d3d12
        run: python tools/run_pe_root_signatures.py --fixture local/pe/root-signatures/root-signatures.exe --output local/pe/root-signatures-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-linked-image-fixture
          path: local/pe/linked-image
      - name: Let native Windows bind and enter the identical EXE and unchanged DLL
        run: python tools/run_pe_linked_image.py --directory local/pe/linked-image --output local/pe/linked-image-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-dynamic-lookup-fixture
          path: local/pe/dynamic-lookup
      - name: Observe the identical guest EXE using actual Windows module and export lookup
        run: python tools/run_pe_dynamic_lookup.py --directory local/pe/dynamic-lookup --output local/pe/dynamic-lookup-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-generated-code-fixture
          path: local/pe/generated-code
      - name: Execute the identical PE emitting and rewriting code using native Windows APIs
        run: python tools/run_pe_generated_code.py --fixture local/pe/generated-code/generated-code.exe --output local/pe/generated-code-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-function-tables-fixture
          path: local/pe/function-tables
      - name: Observe actual Windows dynamic function metadata APIs using the identical PE
        run: python tools/run_pe_function_tables.py --fixture local/pe/function-tables/function-tables.exe --output local/pe/function-tables-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-virtual-unwind-fixture
          path: local/pe/virtual-unwind
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Assert actual native Windows SDK AMD64 context layouts with MSVC
        run: cl /nologo /std:c++17 /W4 /WX /c pe/fixtures/virtual-unwind/sdk-layout.cpp /Folocal/pe/virtual-unwind/sdk-layout.obj
      - name: Execute the identical PE against native Windows RtlVirtualUnwind
        run: python tools/run_pe_virtual_unwind.py --fixture local/pe/virtual-unwind/virtual-unwind.exe --output local/pe/virtual-unwind-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-virtual-unwind-windows
          path: local/pe/virtual-unwind-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-static-functions-fixture
          path: local/pe/static-functions
      - name: Observe native module static lookup deletion rejection and caller restoration
        run: python tools/run_pe_static_functions.py --fixture local/pe/static-functions/static-functions.exe --output local/pe/static-functions-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-static-functions-windows
          path: local/pe/static-functions-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-unwind-saves-fixture
          path: local/pe/unwind-saves
      - name: Assert native SDK integer/vector context slot layouts with MSVC
        run: cl /nologo /std:c++17 /W4 /WX /c pe/fixtures/unwind-saves/sdk-layout.cpp /Folocal/pe/unwind-saves/sdk-layout.obj
      - name: Observe native Windows restoration of near/far integer/vector stack slots
        run: python tools/run_pe_unwind_saves.py --fixture local/pe/unwind-saves/unwind-saves.exe --output local/pe/unwind-saves-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-unwind-saves-windows
          path: local/pe/unwind-saves-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-function-tables-windows
          path: local/pe/function-tables-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-generated-code-windows
          path: local/pe/generated-code-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dynamic-lookup-windows
          path: local/pe/dynamic-lookup-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-linked-image-windows
          path: local/pe/linked-image-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-root-signatures-windows
          path: local/pe/root-signatures-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-binary-com-windows
          path: local/pe/binary-com-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-library-set-windows
          path: local/pe/library-set-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-ordinal-windows
          path: local/pe/ordinal-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-dependent-windows
          path: local/pe/dependent-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-failed-attach-windows
          path: local/pe/failed-attach-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-exports-windows
          path: local/pe/exports-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-peports-release
          path: local/pe/peports
      - name: Execute the identical released peports with native Windows UTF conversion and file APIs
        run: python tools/run_peports_binary.py --binary local/pe/peports/peports.exe --output local/pe/peports-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-windows
          path: local/pe/peports-windows.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-text-conversion-fixture
          path: local/pe/text-conversion
      - name: Observe direct UTF conversion calls against the native Windows API using the identical PE
        run: python tools/run_pe_text_conversion.py --fixture local/pe/text-conversion/text-conversion.exe --output local/pe/text-conversion-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-windows
          path: local/pe/text-conversion-windows.json
  compare-pe:
    needs: [alkyhol-pe, native-windows-pe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path pe/Cargo.toml --locked --offline
      - uses: actions/download-artifact@v4
        with:
          name: pe-alkyhol
          path: local/pe/observations
      - uses: actions/download-artifact@v4
        with:
          name: pe-windows
          path: local/pe/observations
      - run: python tools/compare_pe_probe.py local/pe/observations/windows.json local/pe/observations/alkyhol.json
      - uses: actions/download-artifact@v4
        with:
          name: u-config-alkyhol
          path: local/pe/observations
      - uses: actions/download-artifact@v4
        with:
          name: u-config-windows
          path: local/pe/observations
      - run: python tools/compare_uconfig_binary.py local/pe/observations/u-config-windows.json local/pe/observations/u-config-alkyhol.json
      - uses: actions/download-artifact@v4
        with:
          name: pe-exports-metadata
          path: local/pe/observations
      - uses: actions/download-artifact@v4
        with:
