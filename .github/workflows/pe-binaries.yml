            local/pe/pe32-load-config/load-config-fixture.json
      - name: Build owned directory/record length pairs from frozen load-config bases
        run: python tools/build_pe32_load_config_geometry.py
      - name: Execute load-config length pairs normally and rebased
        run: python tools/run_pe32_load_config_geometry.py --directory local/pe/pe32-load-config-geometry --output local/pe/pe32-load-config-geometry-alkyhol.json
      - uses: actions/upload-artifact@v4
