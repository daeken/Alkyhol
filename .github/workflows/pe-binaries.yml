name: PE binary execution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  number-format-fixture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the owned witness for DAO's reached custom number-format call
        run: python tools/check_pe32_number_format.py --build
      - name: Build the owned hidden-window mouse-default witness
        run: python tools/observe_pe32_mouse_capture.py --client-buttons --output local/pe/mouse-defaults
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-mouse-defaults
          path: |
            local/pe/mouse-defaults/mouse-buttons-default.exe
            local/pe/mouse-defaults/mouse-buttons-default-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-number-format-input
          path: |
            local/pe/number-format/number-format.exe
            local/pe/number-format/inputs.json
  native-number-format:
    needs: number-format-fixture
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pe32-number-format-input
          path: local/pe/number-format
      - name: Observe the identical PE's custom number formatting on native Windows
        run: python tools/check_pe32_number_format.py --native
      - uses: actions/download-artifact@v4
        with:
          name: pe32-mouse-defaults
          path: local/pe/mouse-defaults
      - name: Observe default client buttons and synchronous context callbacks on Windows
        run: python tools/observe_pe32_mouse_capture.py --client-buttons --native --output local/pe/mouse-defaults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mouse-defaults
          path: local/pe/mouse-defaults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-number-format
          path: local/pe/number-format
  pe32-startup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable native execution section bounds without a GUI
        run: |
          mkdir -p local/jit32
          rustc --edition 2024 --test -D warnings pe/probe_exec_ranges.rs -o local/jit32/executable-range-tests
          local/jit32/executable-range-tests
      - name: Test exact decimal formatting without host floating point or locale
        run: |
          rustc --edition 2024 --test -D warnings pe/probe_number_format.rs -o local/jit32/number-format-tests
          local/jit32/number-format-tests
          python -m unittest discover -s tests -p test_pe32_number_format_protocol.py -v
      - name: Fetch locked dependencies before offline PE builds
        if: runner.os == 'macOS'
        run: cargo fetch --manifest-path pe/Cargo.toml --locked
      - name: Microtests for blockers reached during DAO startup; no game files
        run: python tools/check_pe32_startup.py
      - name: Inspect owned PE resources for the DAO activation-context blocker
        run: python tools/check_pe32_activation.py
      - name: Execute the activation lookup bridge and reject unknown EXE/DLL contexts
        run: python tools/check_pe32_activation_miss.py
      - name: Execute genuine file-backed EXE and DLL path queries, including during DLL startup
        run: python tools/check_pe32_module_paths.py
      - name: Execute an explicit backed system-directory profile without guessing DLL paths
        run: python tools/check_pe32_system_directory.py
      - name: Build the frozen owned DLL activation-scope observer
        run: python tools/observe_pe32_activation_startup.py
      - name: Execute identical PE activation scopes and sections against the frozen Windows record
        run: python tools/observe_pe32_activation_startup.py --host
      - name: Build owned private assembly metadata cases for the remaining original CRT blocker
        run: python tools/observe_pe32_assembly_metadata.py
      - name: Build owned empty-DLL, token-exact and three-file activation cases
        run: python tools/observe_pe32_assembly_layout.py
      - name: Execute the identical empty-DLL, token and three-file layouts through Rust against native captures
        run: python tools/observe_pe32_assembly_layout.py --host
      - name: Build the owned API-name variant for the next measured DAO startup call
        run: python tools/observe_pe32_system_windows_directory.py
      - name: Execute the identical system Windows directory probe and explicit profile restrictions
        run: python tools/observe_pe32_system_windows_directory.py --host
      - name: Select the literal owned source-pinned exact-file PE executed on Windows
        run: python tools/observe_pe32_find_file.py --frozen-fixture
      - name: Execute identical exact-file metadata and handles against the frozen Windows record
        run: python tools/observe_pe32_find_file.py --host
      - name: Select the literal owned UTC-qualified FILETIME PE observed on Windows
        run: python tools/observe_pe32_local_filetime.py --frozen-fixture
      - name: Execute identical UTC FILETIME inputs and checked timezone restrictions through Rust
        run: python tools/observe_pe32_local_filetime.py --host
      - name: Select the literal owned calendar PE observed on native Windows
        run: python tools/observe_pe32_calendar_filetime.py --frozen-fixture
      - name: Compare identical calendar fields and invalid-range failures against native Windows
        run: python tools/observe_pe32_calendar_filetime.py --host
      - name: Check reached GetLocalTime against actual host UTC bounds and explicit restrictions
        run: python tools/check_pe32_current_local_time.py
      - name: Exercise the guarded copy import from DAO save loading on real owned files
        run: python tools/check_pe32_copy_file.py
      - name: Compare the literal number-format PE against 548 native Windows observations
        run: python tools/check_pe32_number_format.py
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-copy-file
          path: |
            local/pe/copy-file/case*.exe
            local/pe/copy-file/inputs.json
            local/pe/copy-file/report.json
      - name: Build and assert actual FMOD startup clocks and compare-exchange semantics on the host
        run: |
          python tools/observe_pe32_startup_clock.py
          python tools/observe_pe32_startup_clock.py --host
      - name: Check CRT cdecl allocation, state and real nested callback exits reached by DAO
        run: |
          python tools/observe_pe32_crt_state.py
          python tools/observe_pe32_crt_state.py --host
      - name: Select frozen native x87 evidence and check the bounded intrinsic implementation
        run: |
          python tools/observe_pe32_ci_sqrt.py
          python tools/observe_pe32_ci_sqrt.py --host
      - name: Preserve native arctangent evidence and check the admitted profile
        run: |
          python tools/observe_pe32_ci_atan.py
          python tools/observe_pe32_ci_atan.py --host
      - name: Execute actual exit-table registration and reached A/W startup helpers
        run: |
          python tools/observe_pe32_onexit.py
          python tools/observe_pe32_onexit.py --host
      - name: Execute owned heap resizing for the next actual bundled CRT call
        run: |
          python tools/observe_pe32_heap_realloc.py
          python tools/observe_pe32_heap_realloc.py --host
      - name: Read the actual host cursor for the original Bink startup call
        run: |
          python tools/observe_pe32_cursor.py
          python tools/observe_pe32_cursor.py --host
      - name: Execute separate backed ANSI directory roles reached by original Bink startup
        run: |
          python tools/observe_pe32_ansi_directories.py
          python tools/observe_pe32_ansi_directories.py --host
      - name: Execute top-level filter registration reached by original DAO entry
        run: |
          python tools/observe_pe32_exception_filter.py
          python tools/observe_pe32_exception_filter.py --host
      - name: Execute serialized heap ownership reached by original DAO entry
        run: |
          python tools/observe_pe32_heap_lock.py
          python tools/observe_pe32_heap_lock.py --host
      - name: Execute the host-backed x86 machine profile reached by original DAO startup
        run: |
          python tools/observe_pe32_system_info.py
          python tools/observe_pe32_system_info.py --host
      - name: Execute backed scoped registry behavior reached by original DAO startup
        run: |
          python tools/observe_pe32_registry_open.py
          python tools/observe_pe32_registry_open.py --host
      - name: Execute named-mutex reference lifetimes reached by original DAO startup
        run: |
          python tools/observe_pe32_mutex_create.py
          python tools/observe_pe32_mutex_create.py --host
      - name: Execute the genuine Winmm clock import reached by original DAO startup
        run: |
          python tools/observe_pe32_multimedia_clock.py
          python tools/observe_pe32_multimedia_clock.py --host
      - name: Execute backed directory changes and actual relative reads at the DAO frontier
        run: |
          python tools/observe_pe32_current_directory.py
          python tools/observe_pe32_current_directory.py --host
      - name: Execute the explicit default mutex attributes reached by original DAO startup
        run: |
          python tools/observe_pe32_mutex_attributes.py
          python tools/observe_pe32_mutex_attributes.py --host
      - name: Execute real mutex acquisition, contention and abandonment reached by DAO
        run: |
          python tools/observe_pe32_mutex_ownership.py
          python tools/observe_pe32_mutex_ownership.py --host
      - name: Load real owned icon resources at the reached DAO UI call
        run: |
          python tools/observe_pe32_resource_icon.py
          python tools/observe_pe32_resource_icon.py --host
      - name: Execute the reached unnamed-event constructor and real state transitions
        run: |
          python tools/observe_pe32_unnamed_event.py
          python tools/observe_pe32_unnamed_event.py --host
      - name: Execute the next reached counting-semaphore constructor
        run: |
          python tools/observe_pe32_unnamed_semaphore.py
          python tools/observe_pe32_unnamed_semaphore.py --host
      - name: Execute the reached current-user Documents query with explicit backing
        run: |
          python tools/observe_pe32_documents_folder.py
          python tools/observe_pe32_documents_folder.py --host
      - name: Execute scalar INI defaults only after checking actual file absence
        run: |
          python tools/observe_pe32_private_profile_missing.py
          python tools/observe_pe32_private_profile_missing.py --host
      - name: Execute real directory creation inside an explicit owned profile
        run: |
          python tools/observe_pe32_create_directory.py
          python tools/observe_pe32_create_directory.py --host
      - name: Build native-first scalar settings lifecycle evidence for the next DAO batch
        run: |
          python tools/observe_pe32_profile_roundtrip.py
          python tools/observe_pe32_profile_roundtrip.py --host
      - name: Execute DAO core API families with real shared state
        run: |
          python tools/observe_pe32_runtime_family.py
          python tools/observe_pe32_runtime_family.py --host
      - name: Execute the A/W full-path family through the real current directory
        run: |
          python tools/observe_pe32_full_path.py
          python tools/observe_pe32_full_path.py --host
      - name: Execute complete A/W and mixed-handle wildcard snapshots
        run: |
          python tools/observe_pe32_search_family.py
          python tools/observe_pe32_search_family.py --host
      - name: Execute shared sections, stock brushes and file cursor images
        run: |
          python tools/observe_pe32_section_family.py
          python tools/observe_pe32_section_family.py --host
          python tools/observe_pe32_brush_family.py
          python tools/observe_pe32_brush_family.py --host
          python tools/observe_pe32_cursor_family.py
          python tools/observe_pe32_cursor_family.py --host
      - name: Execute Winsock ordinal ABI against a real loopback server
        run: |
          python tools/observe_pe32_winsock_family.py
          python tools/observe_pe32_winsock_family.py --host
      - name: Execute deferred original DLL lifecycle and mixed registry views
        run: |
          python tools/observe_pe32_deferred_family.py
          python tools/observe_pe32_deferred_family.py --host
          python tools/observe_pe32_registry_ansi.py
          python tools/observe_pe32_registry_ansi.py --host
      - name: Execute real asynchronous directory changes and cancellation
        run: |
          python tools/observe_pe32_watch_family.py
          python tools/observe_pe32_watch_family.py --host
      - name: Execute real queue filters, owner-thread dispatch and paint lifetimes
        run: |
          python tools/observe_pe32_message_family.py
          python tools/observe_pe32_message_family.py --host
      - name: Execute owned resource bitmap RGB readback
        run: |
          python tools/observe_pe32_bitmap_family.py
          python tools/observe_pe32_bitmap_family.py --host
      - name: Execute worker window creation through host main delivery
        run: |
          python tools/observe_pe32_worker_window.py
          python tools/observe_pe32_worker_window.py --host
      - name: Execute GDI device copies and guest-addressable DIB sections
        run: |
          python tools/observe_pe32_gdi_window.py
          python tools/observe_pe32_gdi_window.py --host
      - name: Execute original worker threads with distinct TEB and TLS state
        run: |
          python tools/observe_pe32_thread_family.py
          python tools/observe_pe32_thread_family.py --host
      - name: Execute current-process identity and real available processor relationships
        run: |
          python tools/observe_pe32_process_family.py
          python tools/observe_pe32_process_family.py --host
      - name: Execute actual first-pass x86 software exception delivery
        run: |
          python tools/observe_pe32_software_exception.py
          python tools/observe_pe32_software_exception.py --host
      - name: Execute owned file sharing and descriptor operations
        run: |
          python tools/observe_pe32_file_family.py
          python tools/observe_pe32_file_family.py --host
      - name: Execute DAO save-slot prefix enumeration
        run: |
          python tools/observe_pe32_find_prefix.py
          python tools/observe_pe32_find_prefix.py --host
      - name: Execute DAO live synchronization capacity and object replacement
        run: |
          python tools/observe_pe32_event_capacity.py
          python tools/observe_pe32_event_capacity.py --host
      - name: Execute real native windows and original x86 callbacks
        run: |
          python tools/observe_pe32_window_family.py
          python tools/observe_pe32_window_family.py --host
      - name: Execute DAO capture lifecycle and capture-change callback
        run: |
          python tools/observe_pe32_mouse_capture.py
          python tools/observe_pe32_mouse_capture.py --host
      - name: Execute DAO background capture transfers and restricted ownership
        run: |
          python tools/observe_pe32_mouse_capture.py --background
          python tools/observe_pe32_mouse_capture.py --background --host
          python tools/observe_pe32_mouse_capture.py --client-default
          python tools/observe_pe32_mouse_capture.py --client-default --host
      - name: Execute D3DX system CRT C locale queries and selection
        run: |
          python tools/observe_pe32_c_locale.py
          python tools/observe_pe32_c_locale.py --host
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-startup-microtests
          path: |
            local/pe/startup-microtests/*.exe
            local/pe/startup-microtests/owned.cur
            local/pe/startup-microtests/owned-deferred.dll
            local/pe/startup-microtests/owned-rejected.dll
            local/pe/startup-microtests/owned-context.dll
            local/pe/startup-microtests/module-path.dll
            local/pe/startup-microtests/microtest-inputs.json
            local/pe/startup-microtests/microtest-results.json
            local/pe/startup-microtests/activation-inputs.json
            local/pe/startup-microtests/activation-host.json
            local/pe/startup-microtests/activation-miss-inputs.json
            local/pe/startup-microtests/activation-miss-host.json
            local/pe/startup-microtests/module-path-inputs.json
            local/pe/startup-microtests/module-path-host.json
            local/pe/startup-microtests/system-directory-inputs.json
            local/pe/startup-microtests/system-directory-host.json
            local/pe/startup-microtests/ctx-startup-inputs.json
            local/pe/startup-microtests/ctx-startup-host.json
