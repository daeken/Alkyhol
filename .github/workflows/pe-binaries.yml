          name: pe32-teb-fixture
          path: |
            local/pe/pe32-teb/pe32-teb.exe
            local/pe/pe32-teb/pe32-teb-fixture.json
      - name: Build original compiler-generated static TLS observer
        run: python tools/build_pe32_tls.py
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-tls-fixture
          path: |
            local/pe/pe32-tls/pe32-tls.exe
            local/pe/pe32-tls/pe32-tls-fixture.json
      - name: Build separate compiler TLS data observer without extra zero fill
        run: python tools/build_pe32_tls_data.py
      - name: Execute original compiler TLS data normally rebased and with explicit reentry rejection
        run: python tools/run_pe32_tls_data.py --fixture local/pe/pe32-tls-data/pe32-tls-data.exe --output local/pe/pe32-tls-data-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-tls-data-alkyhol
          path: local/pe/pe32-tls-data-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-tls-data-fixture
          path: |
            local/pe/pe32-tls-data/pe32-tls-data.exe
            local/pe/pe32-tls-data/pe32-tls-data-fixture.json
      - name: Build original legacy load-config cases with compiler-generated GS checks
        run: python tools/build_pe32_load_config.py
      - name: Execute real PE32 DLL dynamic initialization and cdecl/stdcall exports
        run: |
          python tools/build_pe32_library.py
          python tools/run_pe32_library.py --directory local/pe/pe32-library --output local/pe/pe32-library-alkyhol.json
      - name: Execute real PE32 dependent DLLs with a shared TEB and named/ordinal code/data imports
        run: |
          python tools/build_pe32_linked.py
          python tools/run_pe32_linked.py --directory local/pe/pe32-linked --output local/pe/pe32-linked-alkyhol.json
      - name: Execute actual PE32 SafeSEH search and integer continuation under the bounded UD2 profile
        run: |
          python tools/build_pe32_seh.py
          python tools/run_pe32_seh.py --directory local/pe/pe32-seh --output local/pe/pe32-seh-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-seh-fixture
          path: |
            local/pe/pe32-seh/*.exe
            local/pe/pe32-seh/pe32-seh-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-seh-alkyhol
          path: local/pe/pe32-seh-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-linked-fixture
          path: |
            local/pe/pe32-linked/*.dll
            local/pe/pe32-linked/driver.exe
            local/pe/pe32-linked/pe32-linked-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-linked-alkyhol
          path: local/pe/pe32-linked-alkyhol.json
      - uses: actions/upload-artifact@v4
