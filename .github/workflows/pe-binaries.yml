            local/pe/startup-microtests/ctx-meta-inputs.json
            local/pe/startup-microtests/ctx-meta-*.manifest
            local/pe/startup-microtests/ctx-meta-token-importer.dll
            local/pe/startup-microtests/ctx-layout-inputs.json
            local/pe/startup-microtests/ctx-layout-host.json
            local/pe/startup-microtests/ctx-policy-host.json
            local/pe/startup-microtests/system-windows-directory-inputs.json
            local/pe/startup-microtests/system-windows-directory-host.json
            local/pe/startup-microtests/find-file-inputs.json
            local/pe/startup-microtests/find-file-host.json
            local/pe/startup-microtests/local-filetime-inputs.json
            local/pe/startup-microtests/local-filetime-host.json
            local/pe/startup-microtests/calendar-filetime-inputs.json
            local/pe/startup-microtests/calendar-filetime-host.json
