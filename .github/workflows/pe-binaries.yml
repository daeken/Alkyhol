      - uses: actions/download-artifact@v4
        with:
          name: pe-make2compdb-release
          path: local/pe/make2compdb
      - name: Execute the identical released make2compdb against native Windows kernel32 and shell32
        run: python tools/run_make2compdb_binary.py --binary local/pe/make2compdb/make2compdb.exe --output local/pe/make2compdb-windows.json
