            local/pe/startup-microtests/ctx-layout-*.manifest
  native-pe32-startup:
    needs: pe32-startup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch locked dependencies before offline PE builds
        if: runner.os == 'macOS'
        run: cargo fetch --manifest-path pe/Cargo.toml --locked
      - uses: actions/download-artifact@v4
        with:
          name: pe32-startup-microtests
          path: local/pe/startup-microtests
      - uses: actions/download-artifact@v4
        with:
          name: pe32-copy-file
          path: local/pe/copy-file
      - name: Observe the identical copy PE on native Windows using owned temporary files
        run: python tools/check_pe32_copy_file.py --native
      - name: Check identical DAO startup microtests against frozen native captures
        run: python tools/check_pe32_startup.py --native
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Check activation layouts independently against the Windows SDK
        run: cl /nologo /c /W4 /WX /std:c++17 pe/fixtures/pe32-startup/activation-layout.cpp /Folocal/pe/startup-microtests/activation-layout.obj
      - name: Observe actual Win32 activation-context behavior using the identical owned PE
        run: python tools/check_pe32_activation.py --native
      - name: Compare identical empty-context lookup PE with the Rust bridge
