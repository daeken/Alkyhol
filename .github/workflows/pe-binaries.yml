  alkyhol-pe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch locked dependencies before offline PE builds
        if: runner.os == 'macOS'
        run: cargo fetch --manifest-path pe/Cargo.toml --locked
      - run: cargo fmt --manifest-path pe/Cargo.toml --check
      - run: rustfmt --edition 2024 --check pe/launcher.rs
      - run: cargo test --manifest-path pe/Cargo.toml --locked --offline
      - run: cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline
      - run: cargo clippy --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline --all-targets -- -D warnings
      - name: Build an actual Windows executable once with open LLVM
        run: python tools/build_pe_fixture.py
      - name: Execute unchanged PE machine code through Win64 bridges
        run: python tools/run_pe_probe.py --fixture local/pe/fixture/contract.exe --output local/pe/alkyhol.json
      - name: Fetch verified released Windows pkg-config without rebuilding it
        run: python tools/fetch_uconfig_binary.py
      - name: Execute real released PE package queries, listing and quoted Unicode arguments
        run: python tools/run_uconfig_binary.py --binary local/pe/u-config/pkg-config.exe --output local/pe/u-config-alkyhol.json
      - name: Fetch and execute a second unchanged released Windows application
        run: |
          python tools/fetch_make2compdb_binary.py
          python tools/run_make2compdb_binary.py --binary local/pe/make2compdb/make2compdb.exe --output local/pe/make2compdb-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-release
          path: |
            local/pe/make2compdb/make2compdb.exe
            local/pe/make2compdb/make2compdb.c
            local/pe/make2compdb/UNLICENSE
            local/pe/make2compdb/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-make2compdb-alkyhol
          path: local/pe/make2compdb-alkyhol.json
      - name: Observe UTF-8 replacement strict validation and exact byte/unit boundaries
        run: |
          python tools/build_pe_text_conversion.py
          python tools/run_pe_text_conversion.py --fixture local/pe/text-conversion/text-conversion.exe --output local/pe/text-conversion-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-fixture
          path: |
            local/pe/text-conversion/text-conversion.exe
            local/pe/text-conversion/text-conversion-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-text-conversion-alkyhol
          path: local/pe/text-conversion-alkyhol.json
      - name: Build owned DLL and inspect export metadata without entering it
        run: |
          python tools/build_pe_export_fixture.py
          python tools/run_pe_exports.py --dll local/pe/export-fixture/alkyhol_exports.dll --output local/pe/exports-metadata.json
      - name: Execute unchanged released peports over the frozen owned EXE and DLL
        run: |
          python tools/fetch_peports_binary.py
          python tools/run_peports_binary.py --binary local/pe/peports/peports.exe --output local/pe/peports-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-release
          path: |
            local/pe/peports/peports.exe
            local/pe/peports/peports.c
            local/pe/peports/UNLICENSE
            local/pe/peports/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports-alkyhol
          path: local/pe/peports-alkyhol.json
      - name: Execute the original released i386 peports through real Win32 startup and process exit
        run: |
          python tools/fetch_peports32_binary.py
          python tools/run_peports32_binary.py --binary local/pe/peports32/peports.exe --output local/pe/peports32-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports32-release
          path: |
            local/pe/peports32/peports.exe
            local/pe/peports32/peports.c
            local/pe/peports32/UNLICENSE
            local/pe/peports32/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe-peports32-alkyhol
          path: local/pe/peports32-alkyhol.json
      - name: Execute a complete PE32 static EXE and DLL graph through process termination
        run: |
          python tools/build_pe32_process.py
          python tools/run_pe32_process.py --directory local/pe/pe32-process --output local/pe/pe32-process-alkyhol.json
      - uses: actions/upload-artifact@v4
        with:
          name: pe32-process-fixture
          path: |
            local/pe/pe32-process/*.dll
            local/pe/pe32-process/program.exe
            local/pe/pe32-process/pe32-process-fixture.json
