name: DAO DirectInput binary comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rosetta:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --manifest-path pe/Cargo.toml --locked
      - name: Check input units and run the owned PE32 witness
        run: |
          cargo fmt --manifest-path pe/Cargo.toml --check
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline input
          python tools/observe_input8_lifecycle.py
          python tools/observe_input8_lifecycle.py --host
      - name: Execute DAO's ASCII case-insensitive read-only file profile
        run: |
          python tools/observe_pe32_casefold_open.py
          python tools/observe_pe32_casefold_open.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casefold-open-identical-pe
          path: |
            local/pe/casefold-open-microtest/casefold-open.exe
            local/pe/casefold-open-microtest/casefold-open-inputs.json
            local/pe/casefold-open-microtest/casefold-open-host.json
          if-no-files-found: error
      - name: Execute real UDP endpoints, options and datagrams reached by DAO LAN setup
        run: |
          python tools/observe_pe32_socket_broadcast.py
          python tools/observe_pe32_socket_broadcast.py --host
          python tools/observe_pe32_socket_broadcast.py --async-exclusion
          python tools/observe_pe32_socket_broadcast.py --async-exclusion --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-broadcast-identical-pe
          path: |
            local/pe/socket-broadcast-microtest/socket-broadcast.exe
            local/pe/socket-broadcast-microtest/socket-broadcast-inputs.json
            local/pe/socket-broadcast-microtest/socket-broadcast-host.json
            local/pe/socket-broadcast-microtest/socket-async-exclusion-host.json
          if-no-files-found: error
      - name: Execute socket readiness and Win32 descriptor sets reached by DAO
        run: |
          python tools/observe_pe32_socket_select.py
          python tools/observe_pe32_socket_select.py --host
          python tools/observe_pe32_socket_select.py --negative-exclusion
          python tools/observe_pe32_socket_select.py --negative-exclusion --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-select-identical-pe
          path: |
            local/pe/socket-select-microtest/socket-select.exe
            local/pe/socket-select-microtest/socket-select-inputs.json
            local/pe/socket-select-microtest/socket-select-host.json
            local/pe/socket-select-microtest/socket-select-negative-exclusion-host.json
          if-no-files-found: error
      - name: Execute complete large asset reads reached by DAO
        run: |
          python tools/observe_pe32_large_read.py
          python tools/observe_pe32_large_read.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-read-identical-pe
          path: |
            local/pe/large-read-80-microtest/large-read.exe
            local/pe/large-read-80-microtest/large-read-inputs.json
            local/pe/large-read-80-microtest/large-read-host.json
          if-no-files-found: error
      - name: Execute actual filesystem-space accounting reached by DAO
        run: |
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline disk32
          python tools/observe_pe32_disk_space.py
          python tools/observe_pe32_disk_space.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-space-identical-pe
          path: |
            local/pe/disk-space-microtest/disk-space.exe
            local/pe/disk-space-microtest/disk-space-inputs.json
            local/pe/disk-space-microtest/disk-space-host.json
          if-no-files-found: error
      - name: Execute the original network worker's manual/automatic event-set Winsock waits
        run: |
          cargo test --target x86_64-apple-darwin --locked --offline event_set_tests
          python tools/observe_pe32_wsa_events.py
          python tools/observe_pe32_wsa_events.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsa-events-identical-pe
          path: |
            local/pe/wsa-events-microtest/wsa-events.exe
            local/pe/wsa-events-microtest/wsa-events-inputs.json
            local/pe/wsa-events-microtest/wsa-events-host.json
          if-no-files-found: error
      - name: Execute relative INI directories reached by DAO's SKU lookup
        run: |
          python tools/observe_pe32_relative_ini.py
          python tools/observe_pe32_relative_ini.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-ini-identical-pe
          path: |
            local/pe/relative-ini-microtest/relative-ini.exe
            local/pe/relative-ini-microtest/relative-ini-inputs.json
            local/pe/relative-ini-microtest/relative-ini-host.json
          if-no-files-found: error
      - name: Execute FMOD null-module export lookup and real CoreAudio discovery
        run: |
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline wave32
          python tools/observe_pe32_null_module_export.py
          python tools/observe_pe32_null_module_export.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: null-module-export-identical-pe
          path: |
            local/pe/null-module-export-microtest/null-module-export.exe
            local/pe/null-module-export-microtest/null-module-export-inputs.json
            local/pe/null-module-export-microtest/null-module-export-host.json
          if-no-files-found: error
      - name: Execute instruction feature discovery reached by original D3DX
        run: |
          python tools/observe_pe32_cpu_features.py
          python tools/observe_pe32_cpu_features.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-features-identical-pe
          path: |
            local/pe/cpu-features-microtest/cpu-features.exe
            local/pe/cpu-features-microtest/cpu-features-inputs.json
            local/pe/cpu-features-microtest/cpu-features-host.json
          if-no-files-found: error
      - name: Execute legacy registry calls reached by original D3DX
        run: |
          python tools/observe_pe32_registry_legacy.py
          python tools/observe_pe32_registry_legacy.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-legacy-identical-pe
          path: |
            local/pe/registry-legacy-microtest/registry-legacy.exe
            local/pe/registry-legacy-microtest/registry-legacy-inputs.json
            local/pe/registry-legacy-microtest/registry-legacy-host.json
          if-no-files-found: error
      - name: Execute COM initialization reached by original FMOD
        run: |
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline com32
          python tools/observe_pe32_com_apartment.py
          python tools/observe_pe32_com_apartment.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-apartment-identical-pe
          path: |
            local/pe/com-apartment-microtest/com-apartment.exe
            local/pe/com-apartment-microtest/com-apartment-inputs.json
            local/pe/com-apartment-microtest/com-apartment-host.json
          if-no-files-found: error
      - name: Execute the indexed DIB operations reached by DAO font setup
        run: |
          python tools/observe_pe32_palette_dib.py
          python tools/observe_pe32_palette_dib.py --host
          python tools/observe_pe32_palette_dib.py --quantize
          python tools/observe_pe32_palette_dib.py --quantize --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-dib-identical-pe
          path: |
            local/pe/palette-dib-microtest/palette-dib.exe
            local/pe/palette-dib-microtest/palette-dib-inputs.json
            local/pe/palette-dib-microtest/palette-dib-host.json
          if-no-files-found: error
      - name: Execute the file security attributes reached by DAO settings writes
        run: |
          python tools/observe_pe32_file_family.py --output local/pe/file-security-microtest
          python tools/observe_pe32_file_family.py --host --output local/pe/file-security-microtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-security-identical-pe
          path: |
            local/pe/file-security-microtest/file-family.exe
            local/pe/file-security-microtest/file-family-inputs.json
            local/pe/file-security-microtest/file-family-host.json
          if-no-files-found: error
      - name: Execute unnamed mutex ownership, waits and actual worker abandonment
        run: |
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline unnamed_mutex32
          python tools/observe_pe32_unnamed_mutex.py
          python tools/observe_pe32_unnamed_mutex.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unnamed-mutex-identical-pe
          path: |
            local/pe/unnamed-mutex-microtest/unnamed-mutex.exe
            local/pe/unnamed-mutex-microtest/unnamed-mutex-inputs.json
            local/pe/unnamed-mutex-microtest/unnamed-mutex-host.json
          if-no-files-found: error
      - name: Execute the original D3DX CRT allocation and memory ABI witness
        run: |
          python tools/observe_pe32_crt_memory.py
          python tools/observe_pe32_crt_memory.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-memory-identical-pe
          path: |
            local/pe/crt-memory-microtest/crt-memory.exe
            local/pe/crt-memory-microtest/crt-memory-inputs.json
            local/pe/crt-memory-microtest/crt-memory-host.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input8-identical-pe
          path: |
            local/pe/input8-microtest/input8.exe
            local/pe/input8-microtest/input8-inputs.json
            local/pe/input8-microtest/input8-host.json
          if-no-files-found: error
  native:
    needs: rosetta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          name: input8-identical-pe
          path: local/pe/input8-microtest
      - uses: actions/download-artifact@v4
        with:
          name: crt-memory-identical-pe
          path: local/pe/crt-memory-microtest
      - uses: actions/download-artifact@v4
        with:
          name: unnamed-mutex-identical-pe
          path: local/pe/unnamed-mutex-microtest
      - uses: actions/download-artifact@v4
        with:
          name: file-security-identical-pe
          path: local/pe/file-security-microtest
      - uses: actions/download-artifact@v4
        with:
          name: palette-dib-identical-pe
          path: local/pe/palette-dib-microtest
      - uses: actions/download-artifact@v4
        with:
          name: com-apartment-identical-pe
          path: local/pe/com-apartment-microtest
      - uses: actions/download-artifact@v4
        with:
          name: null-module-export-identical-pe
          path: local/pe/null-module-export-microtest
      - uses: actions/download-artifact@v4
        with:
          name: relative-ini-identical-pe
          path: local/pe/relative-ini-microtest
      - uses: actions/download-artifact@v4
        with:
          name: wsa-events-identical-pe
          path: local/pe/wsa-events-microtest
      - uses: actions/download-artifact@v4
        with:
          name: disk-space-identical-pe
          path: local/pe/disk-space-microtest
      - uses: actions/download-artifact@v4
        with:
          name: casefold-open-identical-pe
          path: local/pe/casefold-open-microtest
      - uses: actions/download-artifact@v4
        with:
          name: socket-broadcast-identical-pe
          path: local/pe/socket-broadcast-microtest
      - uses: actions/download-artifact@v4
        with:
          name: socket-select-identical-pe
          path: local/pe/socket-select-microtest
      - name: Compare identical socket readiness PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_socket_select.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-select-native-observation
          path: local/pe/socket-select-microtest/native-socket-select.json
          if-no-files-found: warn
      - uses: actions/download-artifact@v4
        with:
          name: large-read-identical-pe
          path: local/pe/large-read-80-microtest
      - name: Compare identical CPU feature-discovery PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_cpu_features.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-features-native-observation
          path: local/pe/cpu-features-microtest/native-cpu-features.json
          if-no-files-found: warn
      - name: Compare identical legacy registry PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_registry_legacy.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-legacy-native-observation
          path: local/pe/registry-legacy-microtest/native-registry-legacy.json
          if-no-files-found: warn
      - name: Compare identical complete large-read PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_large_read.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-read-native-observation
          path: local/pe/large-read-80-microtest/native-large-read.json
          if-no-files-found: warn
      - name: Compare identical case-insensitive file-open PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_casefold_open.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casefold-open-native-observation
          path: local/pe/casefold-open-microtest/native-casefold-open.json
          if-no-files-found: warn
      - name: Compare identical UDP endpoint, option and datagram PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_socket_broadcast.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-broadcast-native-observation
          path: local/pe/socket-broadcast-microtest/native-socket-broadcast.json
          if-no-files-found: warn
      - name: Compare identical disk-space API and guard witness on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_disk_space.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-space-native-observation
          path: local/pe/disk-space-microtest/native-disk-space.json
          if-no-files-found: warn
      - name: Compare identical Winsock event PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_wsa_events.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsa-events-native-observation
          path: local/pe/wsa-events-microtest/native-wsa-events.json
          if-no-files-found: warn
      - name: Compare identical relative INI path PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_relative_ini.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-ini-native-observation
          path: local/pe/relative-ini-microtest/native-relative-ini.json
          if-no-files-found: warn
      - name: Compare identical null-module export lookup PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_null_module_export.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: null-module-export-native-observation
          path: local/pe/null-module-export-microtest/native-null-module-export.json
          if-no-files-found: warn
      - name: Compare identical COM initialization PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_com_apartment.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-apartment-native-observation
          path: local/pe/com-apartment-microtest/native-com-apartment.json
          if-no-files-found: warn
      - name: Compare identical indexed DIB PE on native Windows
        if: success() || failure()
        run: python tools/observe_pe32_palette_dib.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-dib-native-observation
          path: local/pe/palette-dib-microtest/native-palette-dib.json
          if-no-files-found: warn
      - name: Compare identical file PE, bytes and inheritance metadata
        if: success() || failure()
        run: python tools/observe_pe32_file_family.py --native --output local/pe/file-security-microtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-security-native-observation
          path: local/pe/file-security-microtest/native-file-family.json
          if-no-files-found: warn
      - name: Compare identical mutex PE with native recursive ownership and abandonment
        if: success() || failure()
        run: python tools/observe_pe32_unnamed_mutex.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unnamed-mutex-native-observation
          path: local/pe/unnamed-mutex-microtest/native-unnamed-mutex.json
          if-no-files-found: warn
      - name: Compare the identical original D3DX CRT ABI witness
        if: success() || failure()
        run: python tools/observe_pe32_crt_memory.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-memory-native-observation
          path: local/pe/crt-memory-microtest/native-crt-memory.json
          if-no-files-found: warn
      - name: Check independent SDK layout and compare the identical input PE
        if: success() || failure()
        run: |
          cl /nologo /c /W4 /WX /std:c++17 pe/fixtures/input8/sdk-layout.cpp /Folocal/pe/input8-microtest/sdk-layout.obj
          python tools/observe_input8_lifecycle.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input8-native-observation
          path: local/pe/input8-microtest/native-input8.json
          if-no-files-found: warn
