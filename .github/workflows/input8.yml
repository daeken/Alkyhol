name: DAO DirectInput binary comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rosetta:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --manifest-path pe/Cargo.toml --locked
      - name: Check input units and run the owned PE32 witness
        run: |
          cargo fmt --manifest-path pe/Cargo.toml --check
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline input
          python tools/observe_input8_lifecycle.py
          python tools/observe_input8_lifecycle.py --host
      - name: Execute the indexed DIB operations reached by DAO font setup
        run: |
          python tools/observe_pe32_palette_dib.py
          python tools/observe_pe32_palette_dib.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-dib-identical-pe
          path: |
            local/pe/palette-dib-microtest/palette-dib.exe
            local/pe/palette-dib-microtest/palette-dib-inputs.json
            local/pe/palette-dib-microtest/palette-dib-host.json
          if-no-files-found: error
      - name: Execute the file security attributes reached by DAO settings writes
        run: |
          python tools/observe_pe32_file_family.py --output local/pe/file-security-microtest
          python tools/observe_pe32_file_family.py --host --output local/pe/file-security-microtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-security-identical-pe
          path: |
            local/pe/file-security-microtest/file-family.exe
            local/pe/file-security-microtest/file-family-inputs.json
            local/pe/file-security-microtest/file-family-host.json
          if-no-files-found: error
      - name: Execute unnamed mutex ownership, waits and actual worker abandonment
        run: |
          cargo test --manifest-path pe/Cargo.toml --target x86_64-apple-darwin --locked --offline unnamed_mutex32
          python tools/observe_pe32_unnamed_mutex.py
          python tools/observe_pe32_unnamed_mutex.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unnamed-mutex-identical-pe
          path: |
            local/pe/unnamed-mutex-microtest/unnamed-mutex.exe
            local/pe/unnamed-mutex-microtest/unnamed-mutex-inputs.json
            local/pe/unnamed-mutex-microtest/unnamed-mutex-host.json
          if-no-files-found: error
      - name: Execute the original D3DX CRT allocation and memory ABI witness
        run: |
          python tools/observe_pe32_crt_memory.py
          python tools/observe_pe32_crt_memory.py --host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-memory-identical-pe
          path: |
            local/pe/crt-memory-microtest/crt-memory.exe
            local/pe/crt-memory-microtest/crt-memory-inputs.json
            local/pe/crt-memory-microtest/crt-memory-host.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input8-identical-pe
          path: |
            local/pe/input8-microtest/input8.exe
            local/pe/input8-microtest/input8-inputs.json
            local/pe/input8-microtest/input8-host.json
          if-no-files-found: error
  native:
    needs: rosetta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          name: input8-identical-pe
          path: local/pe/input8-microtest
      - uses: actions/download-artifact@v4
        with:
          name: crt-memory-identical-pe
          path: local/pe/crt-memory-microtest
      - uses: actions/download-artifact@v4
        with:
          name: unnamed-mutex-identical-pe
          path: local/pe/unnamed-mutex-microtest
      - uses: actions/download-artifact@v4
        with:
          name: file-security-identical-pe
          path: local/pe/file-security-microtest
      - uses: actions/download-artifact@v4
        with:
          name: palette-dib-identical-pe
          path: local/pe/palette-dib-microtest
      - name: Compare identical indexed DIB PE on native Windows
        run: python tools/observe_pe32_palette_dib.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-dib-native-observation
          path: local/pe/palette-dib-microtest/native-palette-dib.json
          if-no-files-found: warn
      - name: Compare identical file PE, bytes and inheritance metadata
        run: python tools/observe_pe32_file_family.py --native --output local/pe/file-security-microtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-security-native-observation
          path: local/pe/file-security-microtest/native-file-family.json
          if-no-files-found: warn
      - name: Compare identical mutex PE with native recursive ownership and abandonment
        if: success() || failure()
        run: python tools/observe_pe32_unnamed_mutex.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unnamed-mutex-native-observation
          path: local/pe/unnamed-mutex-microtest/native-unnamed-mutex.json
          if-no-files-found: warn
      - name: Compare the identical original D3DX CRT ABI witness
        if: success() || failure()
        run: python tools/observe_pe32_crt_memory.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-memory-native-observation
          path: local/pe/crt-memory-microtest/native-crt-memory.json
          if-no-files-found: warn
      - name: Check independent SDK layout and compare the identical input PE
        if: success() || failure()
        run: |
          cl /nologo /c /W4 /WX /std:c++17 pe/fixtures/input8/sdk-layout.cpp /Folocal/pe/input8-microtest/sdk-layout.obj
          python tools/observe_input8_lifecycle.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input8-native-observation
          path: local/pe/input8-microtest/native-input8.json
          if-no-files-found: warn
