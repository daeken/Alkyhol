[package]
name = "alkyhol"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Incremental Win32 source compatibility for native hosts"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
cpp-metal-factory = []

[workspace]
exclude = ["graphics", "sakura", "miniengine", "shader", "cpp/runtime", "pe"]
