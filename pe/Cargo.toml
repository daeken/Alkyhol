[package]
name = "alkyhol-pe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded PE64 binary execution against Alkyhol under Rosetta"

[features]
native-runtime32 = []

[dependencies]
alkyhol-host-abi = { path = "host-abi" }
alkyhol = { path = ".." }

[target.'cfg(all(target_os = "macos"))'.dependencies]
alkyhol-d3d9 = { path = "../d3d9" }
roxmltree = { path = "vendor/roxmltree-0.20.0", version = "=0.20.0", default-features = false, features = ["std"] }

[patch.crates-io]
wgpu-hal = { path = "../vendor/wgpu-hal" }
